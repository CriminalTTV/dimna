<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#16140F" />
<title>دمنة — Script Marker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- pinned versions: a floating CDN tag can change under a live site -->
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.0/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg:#16140F; --panel:#1E1B16; --panel2:#26221C; --raise:#302B23;
    --line:#3A342B; --line2:#4B4437; --text:#DDD6CB; --muted:#A0968A;
    --dim:#6D6458; --accent:#C9A87C; --ok:#8CB88A; --warn:#D6A354; --bad:#D98E7A;
  }
  html, body, #root { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text); overflow:hidden;
         font-family:'IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif;
         font-size:14px; -webkit-font-smoothing:antialiased; }
  * { box-sizing:border-box; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:#3B352C; border-radius:6px; border:3px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background:#4E4638; }
  button, select, input, textarea { font-family:inherit; color:inherit; }
  button { cursor:pointer; transition:background .15s ease,border-color .15s ease,color .15s ease,transform .07s ease; }
  button:active:not(:disabled) { transform:translateY(1px); }
  button:disabled { cursor:default; opacity:.38; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .mono { font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; }
  /* English labels inside an RTL interface keep their own reading order ("▸ 2 tags", not "tags 2 ▸");
     Arabic tag names still read right-to-left */
  .btn, .tab, .chip, .fchip, .seg button, .pop-item, .pane-switch button { unicode-bidi:plaintext; }
  /* timecodes and numbers always read left-to-right, even inside an RTL interface */
  span.mono, button.mono, input.mono { direction:ltr; unicode-bidi:isolate; }

  .btn { background:var(--panel2); border:1px solid var(--line); border-radius:7px; padding:7px 12px; font-size:13px; }
  .btn:hover:not(:disabled) { background:var(--raise); border-color:var(--line2); }
  .btn-sm { padding:4px 9px; font-size:12px; border-radius:6px; }
  .btn-xs { padding:2px 7px; font-size:11px; border-radius:5px; }
  .btn-ghost { background:transparent; }
  .btn-ghost:hover:not(:disabled) { background:var(--panel2); }
  .btn-primary { background:var(--accent); border-color:var(--accent); color:#16140F; font-weight:600; }
  .btn-primary:hover:not(:disabled) { background:#D8B98E; border-color:#D8B98E; }
  .tab { background:transparent; border:1px solid transparent; border-radius:7px; padding:5px 12px; font-size:13px; color:var(--muted); }
  .tab:hover { background:var(--panel2); }
  .tab.on { background:var(--panel2); border-color:var(--line2); color:var(--text); font-weight:600; }

  .field { width:100%; background:var(--bg); border:1px solid var(--line); border-radius:7px;
           padding:9px 11px; font-size:14px; line-height:1.75; resize:vertical; }
  .field:focus { border-color:var(--line2); outline:none; }

  .cue { display:flex; gap:13px; padding:6px 11px; border-radius:7px; cursor:pointer;
         border-inline-start:3px solid transparent; align-items:baseline;
         transition:background .16s ease,border-color .16s ease,opacity .16s ease; }
  .cue:hover { background:#201D18; }
  .cue.sel { background:#2E2820; border-inline-start-color:var(--accent); }
  .cue.active { background:#35301F; border-inline-start-color:var(--warn); }
  .cue.active.sel { background:#3C3425; }
  .cue.past .cue-text { opacity:.5; }
  .cue-text { line-height:1.95; flex:1; transition:color .16s ease,opacity .16s ease; }
  .cue.active .cue-text { color:#FFF8EA; }
  .cue-time { font-size:11px; color:var(--dim); flex:none; padding-top:4px; min-width:44px; }
  [dir="rtl"] .cue-time { text-align:right; }
  .cue.active .cue-time { color:var(--warn); }
  .cue.head { border-inline-start-color:var(--line2); margin-top:14px; }
  .cue.head .cue-text { font-weight:700; color:var(--accent); letter-spacing:.01em; }
  /* script lines are picked by click / shift-click, never by text selection */
  .cue { user-select:none; -webkit-user-select:none; }
  .cue textarea, .cue input, .ann-area { user-select:text; -webkit-user-select:text; }

  .ann { border-radius:3px; padding:0 1px; cursor:help; }
  .ann-edit .ann { cursor:pointer; }
  .line-x { color:var(--dim); flex:none; opacity:.55; }
  .line-x:hover { opacity:1; color:var(--bad) !important; }

  /* comments — the brief is the first, flagged comment (item 3b) */
  .comment { background:var(--bg); border:1px solid var(--line); border-radius:7px; padding:6px 10px;
             font-size:13px; line-height:1.7; margin-top:6px; }
  .comment.brief { background:linear-gradient(rgba(201,168,124,.08),rgba(201,168,124,.08)),var(--panel2);
                   border-color:rgba(201,168,124,.38); font-size:15px; line-height:1.8; padding:8px 12px; margin-top:8px; }
  .brief-label { font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin-bottom:2px; }
  .comment-at { font-size:10px; color:var(--dim); margin-top:1px; }
  .c-act { color:var(--dim); opacity:0; padding:1px 5px; }
  .comment:hover .c-act, .c-act:focus-visible { opacity:1; }
  @media (hover:none) { .c-act { opacity:.7; } }
  .no-brief { margin-top:8px; font-size:12px; color:var(--dim); display:flex; align-items:center; gap:8px;
              border:1px dashed var(--line2); border-radius:7px; padding:4px 6px 4px 10px; }
  .add-comment { color:var(--muted); margin-top:6px; }

  /* shot list blocks, width cap and two-column layout (item 10a) */
  .gcard { background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:11px 12px; margin-bottom:8px;
           max-width:720px; transition:padding .16s ease, box-shadow .16s ease, border-color .16s ease; }
  .gcard:hover { border-color:var(--line2); }
  .gcard.annotating { max-width:none; padding:16px; margin-bottom:14px; }
  .mblock { margin-top:9px; padding-top:9px; border-top:1px solid var(--line); }
  .shots { container-type:inline-size; container-name:shots; }
  @container shots (min-width: 1000px) {
    .gcard { max-width:1200px; }
    .gbody.two { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:20px; align-items:start; }
    .gbody.two > .gcol-tags > .mblock:first-child { margin-top:8px; border-top:0; padding-top:0; }
  }
  .ann-notes { margin-top:8px; display:flex; flex-direction:column; gap:4px; }
  .ann-note { display:flex; gap:8px; align-items:baseline; font-size:12px; color:var(--muted); line-height:1.6; }
  .ann-q { color:var(--text); border-radius:3px; padding:0 3px; flex:none; max-width:45%;
           overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* view modes (item 10b) */
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:7px; padding:2px; gap:2px; background:var(--bg); }
  .seg button { background:transparent; border:0; border-radius:5px; padding:3px 9px; font-size:11px; color:var(--muted); }
  .seg button:hover { color:var(--text); }
  .seg button.on { background:var(--panel2); color:var(--text); font-weight:600; box-shadow:inset 0 0 0 1px var(--line2); }
  .shot-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:8px; align-items:start; }
  .shot-grid > .gcard { grid-column:1 / -1; margin-bottom:0; max-width:none; }
  .tile { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; cursor:pointer; min-width:0;
          transition:border-color .15s ease, background .15s ease; }
  .tile:hover, .tile:focus-visible { border-color:var(--line2); background:#221F19; }
  /* header, menus, progress (extras) */
  .hdr { flex:none; display:flex; align-items:center; gap:10px; padding:8px 14px; background:var(--panel);
         border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .proj-name { background:transparent; border:1px solid transparent; border-radius:6px; padding:4px 7px;
               font-size:13px; font-weight:600; width:170px; min-width:0; }
  .proj-name:hover { border-color:var(--line); }
  .proj-name:focus { border-color:var(--line2); outline:none; background:var(--bg); }
  .progress { display:flex; align-items:center; gap:7px; font-size:11px; color:var(--dim); }
  .progress-bar { width:84px; height:5px; border-radius:3px; background:var(--line); overflow:hidden; }
  .progress-bar > div { height:100%; background:var(--ok); border-radius:3px; transition:width .3s ease; }
  .btn-group { display:inline-flex; gap:2px; }
  .pop-sep { height:1px; background:var(--line); margin:4px 2px; }
  .pop-head { font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); padding:6px 10px 2px; }
  .pop-hint { font-size:11px; color:var(--dim); margin-inline-start:16px; }
  .pop-item:disabled { opacity:.4; cursor:default; background:transparent; }
  .filters { display:flex; flex-wrap:wrap; align-items:center; gap:5px; padding:7px 14px; border-bottom:1px solid var(--line); flex:none; }
  .fchip { display:inline-flex; align-items:center; gap:5px; background:transparent; border:1px solid var(--line);
           border-radius:999px; padding:2px 9px; font-size:11px; color:var(--muted); }
  .fchip:hover { border-color:var(--line2); color:var(--text); }
  .fcount { color:var(--dim); font-size:10px; }
  .dur { font-size:11px; color:var(--muted); background:var(--panel2); border:1px solid var(--line);
         border-radius:999px; padding:1px 8px; white-space:nowrap; }
  .fsep { width:1px; height:16px; background:var(--line); margin:0 3px; }
  .gcard.live { border-color:rgba(214,163,84,.6); box-shadow:0 0 0 1px rgba(214,163,84,.22); }
  .live-dot { color:var(--warn); font-size:10px; animation:blink 1.2s ease-in-out infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  .ping { animation:pop .6s ease-out; }
  .onboard { max-width:470px; color:var(--muted); line-height:1.8; background:var(--panel); border:1px solid var(--line);
             border-radius:10px; padding:16px 18px; }
  .onboard-title { font-size:15px; font-weight:600; color:var(--text); margin-bottom:4px; }
  .onboard ol { padding-inline-start:20px; margin:6px 0 10px; }
  .onboard li { margin-bottom:8px; }
  .onboard li .btn { margin-inline-start:6px; }
  .rstats { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px; margin:12px 0 4px; }
  .rstat { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:9px 10px; }
  .tile-text { margin-top:6px; font-size:13px; color:var(--muted); line-height:1.7; display:-webkit-box;
               -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .ann-sel { outline:2px solid var(--text); outline-offset:1px; }
  .ann-tip { position:fixed; z-index:320; transform:translate(-50%,calc(-100% - 6px)); max-width:300px;
             background:var(--raise); border:1px solid var(--line2); border-radius:6px; padding:5px 9px;
             font-size:12px; line-height:1.6; pointer-events:none; white-space:pre-wrap;
             box-shadow:0 8px 20px rgba(0,0,0,.45); }
  .annotating { outline:2px solid var(--accent); outline-offset:-1px;
                box-shadow:0 0 0 6px rgba(201,168,124,.14), 0 10px 30px rgba(0,0,0,.35); }

  @keyframes enter { from{opacity:0;transform:translateY(-5px)} to{opacity:1;transform:none} }
  .enter { animation:enter .17s cubic-bezier(.2,.7,.4,1) both; }
  @keyframes pop { 0%{box-shadow:0 0 0 0 rgba(201,168,124,.5)} 100%{box-shadow:0 0 0 10px rgba(201,168,124,0)} }
  .pop { animation:pop .5s ease-out; }
  @keyframes fade { from{opacity:0} to{opacity:1} }
  .fade { animation:fade .16s ease both; }

  .chip { display:inline-flex; align-items:center; gap:5px; border-radius:999px;
          padding:1px 8px; font-size:11px; font-weight:500; white-space:nowrap; }
  .dot { width:7px; height:7px; border-radius:2px; flex:none; }

  /* themed dropdown + date picker (replace native <select> / type=date) */
  .dd-btn { display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  .dd-caret { font-size:9px; opacity:.65; }
  .pop { position:fixed; z-index:300; background:var(--raise); border:1px solid var(--line2); border-radius:8px;
         box-shadow:0 12px 32px rgba(0,0,0,.55); padding:4px; max-height:300px; overflow-y:auto; }
  .pop-item { display:flex; align-items:center; gap:8px; width:100%; text-align:start; background:transparent;
              border:0; border-radius:6px; padding:6px 10px; font-size:13px; color:var(--text); white-space:nowrap; }
  .pop-item:hover, .pop-item.hot { background:var(--panel2); }
  .pop-item.on { color:var(--accent); font-weight:600; }
  .dp-grid { display:grid; grid-template-columns:repeat(7,30px); gap:2px; }
  .dp-day { height:28px; border:0; border-radius:6px; background:transparent; font-size:12px; color:var(--text); }
  .dp-day:hover { background:var(--panel2); }
  .dp-day.out { color:var(--dim); }
  .dp-day.today { box-shadow:inset 0 0 0 1px var(--accent); }
  .dp-day.on { background:var(--accent); color:#16140F; font-weight:600; }

  .pane { overflow-y:auto; overflow-x:hidden; padding:12px 16px 40px; }
  .pane-head { display:flex; align-items:center; gap:9px; padding:9px 14px;
               border-bottom:1px solid var(--line); flex-wrap:wrap; flex:none; }
  h2 { margin:0; font-size:13px; font-weight:600; letter-spacing:.02em; }

  .grip { flex:none; width:6px; cursor:col-resize; background:transparent; position:relative; }
  .grip::after { content:""; position:absolute; inset:0 2px; background:var(--line); transition:background .15s; }
  .grip:hover::after { background:var(--accent); }
  .grip-h { height:7px; cursor:row-resize; position:relative; background:transparent; }
  .grip-h::after { content:""; position:absolute; inset:2px 0; background:var(--line); transition:background .15s; }
  .grip-h:hover::after { background:var(--accent); }

  .overlay { position:fixed; inset:0; background:rgba(10,9,7,.74); display:flex;
             align-items:center; justify-content:center; z-index:100; padding:20px; }
  .modal { background:var(--panel); border:1px solid var(--line2); border-radius:12px;
           width:100%; max-width:620px; max-height:85vh; display:flex; flex-direction:column;
           box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
           background:var(--raise); border:1px solid var(--line2); border-radius:8px;
           padding:9px 16px; font-size:13px; z-index:200; box-shadow:0 8px 24px rgba(0,0,0,.45); }
  .drop { position:fixed; inset:0; z-index:150; background:rgba(22,20,15,.9);
          display:flex; align-items:center; justify-content:center; border:2px dashed var(--accent); }

  .col { background:var(--panel); border:1px solid var(--line); border-radius:10px;
         display:flex; flex-direction:column; min-height:0; }
  .card { background:var(--panel2); border:1px solid var(--line); border-radius:8px;
          padding:10px; margin-bottom:8px; }
  .cal-day { border:1px solid var(--line); border-radius:7px; padding:5px; min-height:78px;
             background:var(--panel); display:flex; flex-direction:column; gap:3px; overflow:hidden; }
  .cal-day.dim { opacity:.4; }
  .cal-day.today { border-color:var(--accent); }

  /* ---------- phone & touch (item 2) ---------- */
  @supports (height:100dvh) { #root { height:100dvh; } }   /* 100vh ignores the iOS address bar */
  .transport { display:flex; align-items:center; gap:8px; padding:9px 14px; flex-wrap:wrap; }
  .t-main, .t-tags, .t-more { display:contents; }
  .t-divider { width:1px; height:22px; background:var(--line); margin:0 2px; }
  .pane-switch { display:flex; gap:4px; padding:6px 8px; background:var(--panel); border-bottom:1px solid var(--line); flex:none; }
  .pane-switch button { flex:1; background:transparent; border:1px solid var(--line); border-radius:8px; padding:8px 6px;
                        font-size:13px; color:var(--muted); display:flex; align-items:center; justify-content:center; gap:7px; }
  .pane-switch button.on { background:var(--panel2); color:var(--text); border-color:var(--line2); font-weight:600; }
  .pane-switch .mono { font-size:11px; color:var(--dim); }
  .cal-day.picked { border-color:var(--accent); background:var(--panel2); }
  .cal-dots { display:flex; flex-wrap:wrap; gap:3px; margin-top:2px; }
  .cal-list { margin-top:12px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .cal-task { display:flex; align-items:center; gap:8px; width:100%; background:transparent; border:0;
              border-top:1px solid var(--line); padding:9px 2px; color:var(--text); font-size:13px; }
  @media (pointer:coarse) {
    input, textarea, .field { font-size:16px !important; }   /* iOS zooms into any field smaller than 16px */
    .btn { min-height:40px; } .btn-sm { min-height:36px; } .btn-xs { min-height:30px; padding:4px 9px; }
    .tab { min-height:36px; } .seg button { padding:6px 10px; } .fchip { padding:5px 10px; }
    .pop-item { padding:10px 12px; font-size:14px; }
    .c-act, .line-x { opacity:.8; }
  }
  @media (max-width:760px) {
    .split { flex-direction:column !important; }
    .hdr.phone { gap:6px; padding:6px 8px; padding-top:calc(6px + env(safe-area-inset-top)); }
    .phone-row { flex-basis:100%; display:flex; align-items:center; gap:4px; }
    .pane { padding:10px 10px 40px; }
    .pane-head { padding:8px 10px; gap:6px; }
    .gcard { max-width:none; padding:10px; }
    .overlay { padding:0; align-items:stretch; }
    .modal { max-width:none !important; max-height:none; height:100%; border-radius:0; border:0; }
    .shot-grid { grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); }
    .cue { padding:8px; gap:10px; }
    .filters { padding:6px 10px; overflow-x:auto; flex-wrap:nowrap; }
    .fchip { flex:none; }
    .cal-day { min-height:46px; padding:3px; cursor:pointer; }
    .transport.phone { display:block; padding:8px 10px calc(8px + env(safe-area-inset-bottom)); }
    .transport.phone .t-main { display:flex; align-items:center; gap:8px; }
    .transport.phone .t-divider, .transport.phone .t-spacer { display:none; }
    .transport.phone .t-tags { display:flex; gap:6px; overflow-x:auto; flex-wrap:nowrap; padding:8px 0 2px; scrollbar-width:none; }
    .transport.phone .t-tags::-webkit-scrollbar { display:none; }
    .transport.phone .t-tag { flex:none; }
    .transport.phone .t-more { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding-top:8px; margin-top:6px;
                               border-top:1px solid var(--line); }
    .transport.phone .t-more.hidden-phone { display:none; }
  }
  @media (prefers-reduced-motion:reduce) { *,.enter,.pop,.fade { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div id="root"></div>

/* ---------------- time ---------------- */
const TIME_RE = /^(?:(\d{1,3}):)?(\d{1,2}):(\d{1,2})(?:[.,](\d{1,3}))?$/;
function parseTime(s) {
  const m = TIME_RE.exec((s||"").trim());
  if (!m) return null;
  return (m[1]?+m[1]:0)*3600 + +m[2]*60 + +m[3] + (m[4]?+("0."+m[4]):0);
}
const p2 = (n) => String(n).padStart(2,"0");
function tc(sec,fps){ if(!isFinite(sec)||sec<0)sec=0; const t=Math.floor(sec);
  return p2(Math.floor(t/3600))+":"+p2(Math.floor((t%3600)/60))+":"+p2(t%60)+":"+p2(Math.floor((sec-t)*fps)); }
function clock(sec){ if(!isFinite(sec)||sec<0)sec=0;
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=Math.floor(sec%60);
  return (h? h+":"+p2(m) : m)+":"+p2(s); }
// how long a shot runs, in words a person reads at a glance (item 5)
function durText(sec){
  const s=Math.max(0,sec||0);
  if(s<60) return (s<10?Math.round(s*10)/10:Math.round(s))+"s";
  return Math.floor(s/60)+"m "+p2(Math.round(s%60))+"s";
}
const localISO = (d) => d ? d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()) : "";
const today = () => localISO(new Date());

/* ---------------- script parsing ----------------
   Symbols:  # Heading   ## Subheading   "Heading"   > Note   // comment (ignored)
   Times:    SRT/VTT arrows, start/end/text triplets, [0:00 - 0:04] inline           */
function parseScript(raw, fillGaps) {
  if (!raw || !raw.trim()) return [];
  const out = [];
  let pending = [], lastWasText = false;
  const push = (o) => { out.push(Object.assign({ id:uid(), kind:"line", start:null, end:null, origEnd:null }, o)); };

  for (const rawLine of raw.replace(/\r/g,"").split("\n")) {
    const line = rawLine.trim();
    if (!line) { lastWasText = false; continue; }
    if (/^\/\//.test(line) || /^WEBVTT/i.test(line)) continue;

    let mh = /^(#{1,3})\s+(.*)$/.exec(line);
    if (mh) { push({ kind:"head", level:mh[1].length, text:mh[2],
                     start: pending.length ? pending[0] : null }); pending=[]; lastWasText=false; continue; }
    if (/^".+"$/.test(line)) { push({ kind:"head", level:1, text:line.slice(1,-1),
                     start: pending.length ? pending[0] : null }); pending=[]; lastWasText=false; continue; }
    if (/^>\s+/.test(line)) { push({ kind:"note", text:line.replace(/^>\s+/,""),
                     start: pending.length ? pending[0] : null }); pending=[]; lastWasText=false; continue; }

    const inline = /^\[\s*([0-9:.,]+)\s*[-–—]\s*([0-9:.,]+)\s*\]\s*(.+)$/.exec(line);
    if (inline) {
      const a = parseTime(inline[1]), b = parseTime(inline[2]);
      if (a !== null) { push({ text:inline[3], start:a, end:b }); pending=[]; lastWasText=true; continue; }
    }
    const arrow = line.split("-->");
    if (arrow.length === 2) {
      const a = parseTime(arrow[0]), b = parseTime(arrow[1].split(/\s+/).filter(Boolean)[0]);
      if (a !== null) { pending = b!==null ? [a,b] : [a]; lastWasText=false; continue; }
    }
    const t = parseTime(line);
    if (t !== null) { if (lastWasText) pending=[]; pending.push(t); lastWasText=false; continue; }
    if (/^\d{1,5}$/.test(line) && !pending.length && !lastWasText) continue;

    if (pending.length) {
      push({ text:line, start:pending[0], end: pending.length>1 ? pending[1] : null });
      pending = []; lastWasText = true;
    } else if (lastWasText && out.length && out[out.length-1].kind === "line") {
      out[out.length-1].text += " " + line;
    } else {
      push({ text:line }); lastWasText = true;
    }
  }

  // remember the real spoken end, then optionally stretch to the next line
  for (let i=0;i<out.length;i++) {
    if (out[i].start === null) continue;
    out[i].origEnd = out[i].end;
    let nextStart = null;
    for (let j=i+1;j<out.length;j++) if (out[j].start !== null) { nextStart = out[j].start; break; }
    if (fillGaps && nextStart !== null) out[i].end = nextStart;
    else if (out[i].end === null && nextStart !== null) out[i].end = nextStart;
  }
  return out;
}

/* ---------------- tag list parsing ----------------
   tag | start | end | status | due | note        (# lines ignored)          */
function parseTagList(raw, tags) {
  const rows = [], unknown = [];
  raw.replace(/\r/g,"").split("\n").forEach((l) => {
    const line = l.trim();
    if (!line || line[0] === "#") return;
    const p = line.split("|").map((x) => x.trim());
    if (p.length < 3) return;
    const start = parseTime(p[1]), end = parseTime(p[2]);
    if (start === null) return;
    const found = tags.find((t) => t.label.toLowerCase() === p[0].toLowerCase() || t.id === p[0]);
    if (!found && unknown.indexOf(p[0]) === -1) unknown.push(p[0]);
    const st = (p[3]||"todo").toLowerCase();
    rows.push({
      tagLabel: p[0], tagId: found ? found.id : null,
      start, end: end === null ? start : end,
      status: STATUS.find((s) => s.id === st) ? st : "todo",
      due: /^\d{4}-\d{2}-\d{2}$/.test(p[4]||"") ? p[4] : "",
      note: p.slice(5).join(" | ") || "",
    });
  });
  return { rows, unknown };
}

/* ---------------- lines under a time range ----------------
   A line counts when at least 0.25s of its spoken part (start → origEnd, not the
   gap-filled end) falls inside [a,b]. Lines under 0.5s need half their length.   */
function cuesInRange(cues, a, b, offset) {
  const lo=Math.min(a,b), hi=Math.max(a,b), off=offset||0;
  return cues.filter((c)=>{
    if (c.kind!=="line" || c.start==null) return false;
    const s=c.start+off;
    const spoken=c.origEnd!=null ? c.origEnd : c.end!=null ? c.end : c.start;
    const e=Math.max(s, spoken+off);
    return Math.min(e,hi)-Math.max(s,lo) >= Math.min(0.25,(e-s)/2);
  }).map((c)=>c.id);
}

/* ---------------- re-anchoring tags onto a new script version (item 9) ----------------
   Each tag keeps its time range and is linked to the new lines under it
   (cuesInRange). Highlights move by finding the same words in the tag's new
   lines — split in two when a new line break falls inside them. Ones that
   can't be found are kept, flagged orphan with their text, so a later reload
   can still place them.                                                     */
function phraseOf(a, oldCues, oldIndex){ const c=oldCues[oldIndex[a.cueId]]; return c?c.text.slice(a.s,a.e):(a.text||""); }
function orphanAnn(a, oldCues, oldIndex){ return Object.assign({},a,{ orphan:true, text:phraseOf(a,oldCues,oldIndex) }); }
function moveAnnotations(anns, lines, oldCues, oldIndex){
  let joined=""; const starts=[];
  lines.forEach((c,i)=>{ starts.push(joined.length); joined+=c.text+(i<lines.length-1?" ":""); });
  const out=[]; let moved=0, lost=0;
  anns.forEach((a)=>{
    const phrase=phraseOf(a,oldCues,oldIndex);
    if(!phrase.trim()){ out.push(a); return; }
    const oc=oldCues[oldIndex[a.cueId]], t0=oc&&oc.start!=null?oc.start:null;
    // every occurrence; pick the one whose line starts closest in time to the old line
    let best=-1, bestD=Infinity, from=0, at;
    while((at=joined.indexOf(phrase,from))>=0){
      let li=0; while(li+1<starts.length&&starts[li+1]<=at) li++;
      const d=t0==null?0:Math.abs((lines[li].start||0)-t0);
      if(d<bestD){ bestD=d; best=at; }
      from=at+1;
    }
    if(best<0){ lost++; out.push(orphanAnn(a,oldCues,oldIndex)); return; }
    moved++;
    let first=true;
    lines.forEach((c,i)=>{
      const ls=starts[i], le=ls+c.text.length, s=Math.max(best,ls), e=Math.min(best+phrase.length,le);
      if(e<=s) return;
      const x=Object.assign({},a,{ cueId:c.id, s:s-ls, e:e-ls }); delete x.orphan; delete x.text;
      if(!first) x.id=uid();
      first=false; out.push(x);
    });
  });
  return { out, moved, lost };
}
function planReanchor(markers, oldCues, oldIndex, newCues, offset, rangeOf){
  const byId={}; newCues.forEach((c)=>{ byId[c.id]=c; });
  const rows=[]; let hlMoved=0, hlLost=0;
  const next=markers.map((m)=>{
    const r=rangeOf(m);
    if(!(m.cueIds||[]).length){ rows.push({ m, kind:"kept", r }); return m; }   // time-only tags stay as they are
    const ids=cuesInRange(newCues,r.start,r.end,offset);
    if(!ids.length){
      // no line under it any more: keep it as a region at its old times so nothing is lost
      rows.push({ m, kind:"unmatched", r });
      hlLost+=(m.annotations||[]).length;
      return Object.assign({},m,{ cueIds:[], start:r.start, end:r.end,
        annotations:(m.annotations||[]).map((a)=>orphanAnn(a,oldCues,oldIndex)) });
    }
    const spans=ids.map((id)=>{ const c=byId[id]; return { s:c.start+offset, e:(c.origEnd!=null?c.origEnd:c.end!=null?c.end:c.start)+offset }; });
    const nr={ start:Math.min(...spans.map((x)=>x.s)), end:Math.max(...spans.map((x)=>x.e)) };
    rows.push({ m, kind:Math.max(r.start-nr.start,nr.end-r.end)>0.5?"ambiguous":"clean", r, nr });
    const res=moveAnnotations(m.annotations||[], ids.map((id)=>byId[id]), oldCues, oldIndex);
    hlMoved+=res.moved; hlLost+=res.lost;
    return Object.assign({},m,{ cueIds:ids, annotations:res.out });
  });
  const n=(k)=>rows.filter((x)=>x.kind===k).length;
  return { markers:next, rows, hlMoved, hlLost,
           counts:{ clean:n("clean"), ambiguous:n("ambiguous"), unmatched:n("unmatched"), kept:n("kept") } };
}

const SCHEMA=2;
function migrateMarker(m){

function migrateProject(p){

/* ---------------- waveform decode ----------------
   Decode once at 8 kHz and keep the samples (~52 MB for 27 min). Min/max
   summaries per 16 / 256 / 4096 samples let any zoom level read only a few
   values per screen pixel; zoomed right in, columns() reads raw samples.   */
async function analyse(file) {
  const buf = await file.arrayBuffer();
  const Ctx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const audio = await new Ctx(1,1,8000).decodeAudioData(buf);
  const samples = audio.getChannelData(0), sr = audio.sampleRate;
  const l16 = summarise(samples,false,16), l256 = summarise(l16,true,16), l4096 = summarise(l256,true,16);
  let mx=0; for(let i=0;i<l4096.length;i++){ const v=Math.abs(l4096[i]); if(v>mx) mx=v; }
  const norm = mx>0 ? 1/mx : 1;
  // loudness per 50 ms, for the silence shading
  const win = Math.max(1,Math.round(sr*0.05)), rms = new Float32Array(Math.ceil(samples.length/win));
  for(let i=0;i<rms.length;i++){
    let sum=0; const s=i*win, e=Math.min(s+win,samples.length);
    for(let j=s;j<e;j++) sum+=samples[j]*samples[j];
    rms[i]=Math.sqrt(sum/Math.max(1,e-s))*norm;
  }
  return { samples, sr, norm, rms, duration:audio.duration,
           levels:[{size:16,data:l16},{size:256,data:l256},{size:4096,data:l4096}] };
}
// one [min,max] pair per `factor` inputs; input is raw samples or [min,max] pairs
function summarise(src, pairs, factor){
  const n = pairs ? src.length/2 : src.length, m = Math.ceil(n/factor), out = new Float32Array(m*2);
  for(let i=0;i<m;i++){
    let lo=Infinity, hi=-Infinity; const e=Math.min(n,(i+1)*factor);
    for(let j=i*factor;j<e;j++){
      const a = pairs ? src[2*j] : src[j], b = pairs ? src[2*j+1] : src[j];
      if(a<lo) lo=a; if(b>hi) hi=b;
    }
    out[2*i]=lo; out[2*i+1]=hi;
  }
  return out;
}
// normalised [min,max] for each of `cols` columns across the window vs..ve (seconds)
function columns(wave, vs, ve, cols){
  const out = new Float32Array(cols*2), n = wave.samples.length;
  const s0 = vs*wave.sr, spp = Math.max(1e-6,(ve-vs)*wave.sr/cols);
  let lvl = null; for(const L of wave.levels) if(L.size<=spp) lvl=L;   // coarsest summary still finer than a column
  for(let x=0;x<cols;x++){
    const a = Math.max(0,Math.floor(s0+x*spp)), b = Math.min(n,Math.max(a+1,Math.floor(s0+(x+1)*spp)));
    let lo=Infinity, hi=-Infinity;
    if(lvl){
      const d=lvl.data, i1=Math.min(d.length/2,Math.ceil(b/lvl.size));
      for(let i=Math.floor(a/lvl.size);i<i1;i++){ if(d[2*i]<lo) lo=d[2*i]; if(d[2*i+1]>hi) hi=d[2*i+1]; }
    } else {
      for(let j=a;j<b;j++){ const v=wave.samples[j]; if(v<lo) lo=v; if(v>hi) hi=v; }
    }
    if(lo>hi){ lo=0; hi=0; }
    out[2*x]=lo*wave.norm; out[2*x+1]=hi*wave.norm;
  }
  return out;
}
function silentRuns(rms, duration, thresh, minSec){
  const per = duration/rms.length, runs=[]; let s=-1;
  for(let i=0;i<rms.length;i++){
    if(rms[i]<thresh){ if(s<0)s=i; }
    else { if(s>=0 && (i-s)*per>=minSec) runs.push([s*per,i*per]); s=-1; }
  }
  if(s>=0 && (rms.length-s)*per>=minSec) runs.push([s*per,duration]);
  return runs;
}

/* ---------------- text annotation helpers ---------------- */
function offsetIn(root, node, off) {
  let n=0, done=false;
  (function walk(el){
    if(done) return;
    if(el.nodeType===3){ if(el===node){ n+=off; done=true; } else n+=el.nodeValue.length; return; }
    for(let i=0;i<el.childNodes.length;i++){ walk(el.childNodes[i]); if(done) return; }
  })(root);
  return n;
}
function segments(text, anns){
  const pts = new Set([0, text.length]);
  anns.forEach((a)=>{ pts.add(clamp(a.s,0,text.length)); pts.add(clamp(a.e,0,text.length)); });
  const p = Array.from(pts).sort((a,b)=>a-b);
  const out=[];
  for(let i=0;i<p.length-1;i++){
    const s=p[i], e=p[i+1]; if(e<=s) continue;
    out.push({ s,e, text:text.slice(s,e), anns: anns.filter((a)=>a.s<=s && a.e>=e) });
  }
  return out;
}

  const fetchCloudAudio=useCallback(async(p)=>{

  const cueIndex=useMemo(()=>{ const m={}; cues.forEach((c,i)=>m[c.id]=i); return m; },[cues]);

  const uiDir=useMemo(()=>{

    let found=-1;

  const statusCounts=useMemo(()=>{ const o={}; STATUS.forEach((s)=>o[s.id]=markers.filter((m)=>(m.status||"todo")===s.id).length); return o; },[markers]);

    const map=new Map();
    let list=sorted;

    list.forEach((m)=>{
      const key=(m.cueIds&&m.cueIds.length)?m.cueIds.slice().sort().join("|"):"free:"+m.id;

      if(!map.has(key)) map.set(key,{key,items:[],start:r.start,end:r.end});

  },[sorted,filter,statusFilter,range]);

  const markersByCue=useMemo(()=>{ const o={};
    markers.forEach((m)=>(m.cueIds||[]).forEach((id)=>{ (o[id]=o[id]||[]).push(m); })); return o; },[markers]);

  const gaps=useMemo(()=>{
    if(!duration) return [];

  const openAudio=(e)=>{ const f=e.target.files&&e.target.files[0]; if(f) loadAudioFile(f); e.target.value=""; };

  const playRange=(a,b)=>{ const au=audioRef.current; if(!au) return; seek(a); stopAt.current=b;

  const jumpShot=(dir)=>{

  // a tag chip in the script scrolls the shot list to its block
  const jumpToGroup=(key)=>{

  const addComment=(m,text,brief)=>{

  const editComment=(m,cid,text)=>{

    if(Number.isFinite(m.start)&&Number.isFinite(m.end)){

      if(typing){ if(e.key==="Escape") e.target.blur(); return; }

  useEffect(()=>{

    if(!el||!pane) return;

    if(er.top<pr.top+60||er.bottom>pr.bottom-60){

  useEffect(()=>{

  const waveT=(clientX)=>{

      const b=bodyRef.current; if(!b) return;
      const r=b.getBoundingClientRect(), rtl=getComputedStyle(b).direction==="rtl";
      // splitPct is the script pane's share; in RTL that pane sits on the right
      setUi({ splitPct: clamp(((rtl?r.right-ev.clientX:ev.clientX-r.left)/r.width)*100, 22, 82) });
    };
    const up=()=>{ window.removeEventListener("pointermove",move); window.removeEventListener("pointerup",up); window.removeEventListener("pointercancel",up); };
    window.addEventListener("pointermove",move); window.addEventListener("pointerup",up); window.addEventListener("pointercancel",up);
  };
  const startWaveResize=(e)=>{
    e.preventDefault();
    const y0=e.clientY, h0=ui.waveH;
    const move=(ev)=>setUi({ waveH: clamp(h0+(y0-ev.clientY),46,340) });
    const up=()=>{ window.removeEventListener("pointermove",move); window.removeEventListener("pointerup",up); window.removeEventListener("pointercancel",up); };
    window.addEventListener("pointermove",move); window.addEventListener("pointerup",up); window.addEventListener("pointercancel",up);
  };

  /* ---- import ---- */
  const applyScript=(text,replace,fillGaps)=>{
    const parsed=parseScript(text,fillGaps);
    if(!parsed.length){ say("Nothing to import."); return; }
    if(replace&&markers.length){
      // never wipe tags silently: preview moving them onto the new lines first (item 9)
      setReanchor({ parsed, plan:planReanchor(markers,cues,cueIndex,parsed,offset,range) });
      setImportOpen(false); return;
    }
    commit({ cues:replace?parsed:cues.concat(parsed), markers });
    setImportOpen(false); setSel([]); setAnnotId(null);
    say("Imported "+parsed.length+" lines"+(fillGaps?" · gaps filled":"")+".");
  };
  const applyReanchor=(wipe)=>{
    const { parsed, plan }=reanchor;
    commit({ cues:parsed, markers:wipe?[]:plan.markers });
    setReanchor(null); setSel([]); setAnnotId(null); setExpanded({});
    say(wipe?"Script replaced · all tags deleted"
            :"Script replaced · "+plan.markers.length+" tag"+(plan.markers.length===1?"":"s")+" kept",true);
  };
  const readTxt=(f,then)=>{ const r=new FileReader(); r.onload=()=>then(String(r.result)); r.readAsText(f,"utf-8"); };

  const openTxt=(e)=>{ const f=e.target.files&&e.target.files[0]; if(!f) return;
    readTxt(f,(t)=>{ setImportText(t); setImportOpen(true); }); e.target.value=""; };
  const openTagTxt=(e)=>{ const f=e.target.files&&e.target.files[0]; if(!f) return;
    readTxt(f,(t)=>setTagImport({ raw:t })); e.target.value=""; };

  const applyTagList=(raw,mode)=>{
    const { rows,unknown }=parseTagList(raw,tags);
    if(!rows.length){ say("No valid rows found."); return; }
    let nextTags=tags.slice();
    unknown.forEach((label)=>{
      nextTags=nextTags.concat({ id:uid(), label, color:PALETTE[nextTags.length%PALETTE.length] });
    });
    const resolve=(label)=>(nextTags.find((t)=>t.label.toLowerCase()===label.toLowerCase())||nextTags[0]).id;
    const incoming=rows.map((r)=>({
      id:uid(), tagId:r.tagId||resolve(r.tagLabel), cueIds:[], start:r.start, end:r.end,
      comments:r.note?[{ id:uid(), text:r.note, at:Date.now(), brief:true }]:[], annotations:[], status:r.status, due:r.due,
    }));
    let keep=markers;
    if(mode==="replace"){
      const hits=(m)=>{ const r=range(m); return incoming.some((n)=>n.start<r.end&&n.end>r.start); };
      keep=markers.filter((m)=>!hits(m));
    }
    commit({ tags:nextTags, markers:keep.concat(incoming) });
    setTagImport(null);
    say("Added "+incoming.length+" tags"+(unknown.length?" · created "+unknown.length+" new tag type(s)":"")+".");
  };

  /* drag & drop anywhere */
  useEffect(()=>{
    const over=(e)=>{ e.preventDefault(); setDropping(true); };
    const leave=(e)=>{ if(e.relatedTarget===null) setDropping(false); };
    const drop=(e)=>{
      e.preventDefault(); setDropping(false);
      const f=e.dataTransfer.files&&e.dataTransfer.files[0]; if(!f) return;
      const n=f.name.toLowerCase();
      if(/\.(mp3|wav|m4a|aac|ogg|flac|mp4|mov|mkv|webm)$/.test(n)) return loadAudioFile(f);
      if(/\.json$/.test(n)) return readTxt(f,loadProjectJson);
      if(/\.(txt|srt|vtt|md)$/.test(n)) return readTxt(f,(t)=>{
        if(/^\s*[^|\n]+\|[^|\n]+\|/m.test(t) && !/-->/.test(t)) setTagImport({raw:t});
        else { setImportText(t); setImportOpen(true); }
      });
      say("Unsupported file type.");
    };
    window.addEventListener("dragover",over); window.addEventListener("dragleave",leave); window.addEventListener("drop",drop);
    return ()=>{ window.removeEventListener("dragover",over); window.removeEventListener("dragleave",leave); window.removeEventListener("drop",drop); };
  },[proj]);

  /* ---- exports ---- */
  const dl=(name,text,mime)=>{
    const url=URL.createObjectURL(new Blob([text],{type:mime}));
    const a=document.createElement("a"); a.href=url; a.download=name; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  };
  const slug=()=>proj.name.replace(/\s+/g,"-");
  const exportBrief=()=>{
    let out="# "+proj.name+"\n\n"+sorted.length+" shots · "+fps+" fps"+(proj.audioName?" · "+proj.audioName:"")+"\n";
    if(proj.startDate||proj.dueDate) out+="Schedule: "+(proj.startDate||"?")+" → "+(proj.dueDate||"?")+"\n";
    out+="\n---\n\n";
    groups.forEach((gr,i)=>{
      out+="## "+(i+1)+". "+tc(gr.start,fps)+" → "+tc(gr.end,fps)+"  ("+durText(gr.end-gr.start)+")\n\n";
      const texts=(gr.items[0].cueIds||[]).map((id)=>(cues[cueIndex[id]]||{}).text).filter(Boolean);
      if(texts.length) out+="Script: "+texts.join(" ")+"\n\n";
      gr.items.forEach((m)=>{
        out+="- **"+tagOf(m.tagId).label+"** ["+(STATUS.find((s)=>s.id===(m.status||"todo"))||{}).label+
             (m.due?" · due "+m.due:"")+"] — "+(briefText(m)||"(no brief yet)")+"\n";
        (m.comments||[]).filter((c)=>!c.brief).forEach((c)=>out+="    - "+c.text+"\n");
        (m.annotations||[]).forEach((a)=>{
          const c=cues[cueIndex[a.cueId]];
          if(c) out+="    - “"+c.text.slice(a.s,a.e)+"” → "+(a.note||a.style)+"\n";
        });
      });
      out+="\n";
    });
    dl(slug()+"-brief.md",out,"text/markdown;charset=utf-8");
  };
  const exportCsv=()=>{
    const esc=(s)=>'"'+String(s==null?"":s).replace(/"/g,'""')+'"';
    const rows=[["Marker Name","Description","In","Out","Duration","Marker Type","Status","Due"]];
    sorted.forEach((m,i)=>{ const r=range(m);
      rows.push([(i+1)+" "+tagOf(m.tagId).label,briefText(m),tc(r.start,fps),tc(r.end,fps),
                 tc(Math.max(0,r.end-r.start),fps),"Comment",(m.status||"todo"),m.due||""]); });
    dl(slug()+"-markers.csv","\uFEFF"+rows.map((r)=>r.map(esc).join(",")).join("\n"),"text/csv;charset=utf-8");
  };
  const exportTagList=()=>{
    let out="# Dimna tag list — "+proj.name+"\n# tag | start | end | status | due | note\n";
    sorted.forEach((m)=>{ const r=range(m);
      out+=[tagOf(m.tagId).label,clock(r.start),clock(r.end),(m.status||"todo"),(m.due||""),briefText(m).replace(/\s*\n\s*/g," ")].join(" | ")+"\n"; });
    dl(slug()+"-tags.txt",out,"text/plain;charset=utf-8");
  };
  const exportProject=()=>dl(slug()+".dimna.json",JSON.stringify(proj,null,2),"application/json");
  // .json import and drag-drop both land here: old exports are upgraded on the way in
  function loadProjectJson(t){
    try{
      const raw=JSON.parse(t); if(!raw||!Array.isArray(raw.cues)) throw 0;
      const d=migrateProject(raw); d.id=d.id||uid();
      setProjRaw(d); setSel([]); setAnnotId(null); say("Loaded “"+(d.name||"project")+"”.");
    }catch(err){ say("Not a Dimna project file."); }
  }
  const importProject=(e)=>{ const f=e.target.files&&e.target.files[0]; if(!f) return;
    readTxt(f,loadProjectJson); e.target.value=""; };

  const visibleCues=useMemo(()=>{
    if(!query.trim()) return cues;
    return cues.filter((c)=>c.text.indexOf(query.trim())!==-1);
  },[cues,query]);

  const selCount=sel.length;
  const hasRegion=region&&Math.abs(region.b-region.a)>0.05;
  const importItems=[
    { label:"Script file (.txt / .srt / .vtt)", onClick:()=>txtRef.current&&txtRef.current.click() },
    { label:"Paste a script…", onClick:()=>{ setImportText(""); setImportOpen(true); } },
    { label:"Tag list (.txt)", onClick:()=>tagTxtRef.current&&tagTxtRef.current.click() },
    { sep:true },
    { label:"Project backup (.json)", onClick:()=>jsonRef.current&&jsonRef.current.click() },
  ];
  const exportItems=[
    { label:"Brief for animators", hint:".md", onClick:exportBrief, disabled:!markers.length },
    { label:"Markers for Premiere / Resolve", hint:".csv", onClick:exportCsv, disabled:!markers.length },
    { label:"Tag list", hint:".txt", onClick:exportTagList, disabled:!markers.length },
    { sep:true },
    { label:"Project backup", hint:".json", onClick:exportProject },
  ];
  const donePct=markers.length?Math.round(statusCounts.done/markers.length*100):0;

  /* ================= render ================= */
  return (
    <div dir={uiDir} style={{height:"100%",display:"flex",flexDirection:"column"}}>

      {isPhone?(
        <header className="hdr phone">
          <img src={LOGO} alt="دمنة" style={{height:22,opacity:.92}} />
          <input className="proj-name" value={proj.name} onChange={(e)=>patch({name:e.target.value})} dir="auto"
            title="Project name" style={{flex:1,width:"auto"}} />
          <button className="btn btn-sm btn-ghost" onClick={undo} disabled={!history.current.length} aria-label="Undo" title="Undo">↶</button>
          <button className="btn btn-sm btn-ghost" onClick={redo} disabled={!future.current.length} aria-label="Redo" title="Redo">↷</button>
          <MenuButton className="btn btn-sm" title="Menu" label="☰" items={[
            { head:"Project" },
            { label:"Projects", onClick:()=>setProjOpen(true) },
            { label:"Tags", onClick:()=>setTagsOpen(true) },
            ...(user?[
              { label:syncing?"Syncing…":"Sync now", onClick:()=>syncCloud() },
              { label:"Cloud settings", onClick:()=>setCloudOpen(true) },
              { label:"Sign out", onClick:signOut },
            ]:[
              { label:"Sign in & sync", onClick:()=>setCloudOpen(true) },
            ]),
            { head:"Import" }, ...importItems.filter((it)=>!it.sep),
            { head:"Export" }, ...exportItems.filter((it)=>!it.sep),
            { sep:true },
            { label:"Formats & shortcuts", onClick:()=>setHelpOpen(true) },
          ]} />
          <div className="phone-row">
            {[["script","Script"],["board","Board"],["calendar","Calendar"]].map(([k,l])=>(
              <button key={k} className={"tab"+(view===k?" on":"")} onClick={()=>setView(k)}>{l}</button>
            ))}
            <div style={{flex:1}} />
            {markers.length>0&&(
              <div className="progress" title={statusCounts.done+" of "+markers.length+" shots done"}>
                <div className="progress-bar" style={{width:54}}><div style={{width:donePct+"%"}} /></div>
                <span className="mono">{statusCounts.done}/{markers.length}</span>
              </div>
            )}
          </div>
        </header>
      ):(
      <header className="hdr">
        <img src={LOGO} alt="دمنة" style={{height:24,opacity:.92}} />
        <input className="proj-name" value={proj.name} onChange={(e)=>patch({name:e.target.value})} dir="auto" title="Project name" />
        <div style={{display:"flex",gap:3}}>
          {[["script","Script"],["board","Board"],["calendar","Calendar"]].map(([k,l])=>(
            <button key={k} className={"tab"+(view===k?" on":"")} onClick={()=>setView(k)}>{l}</button>
          ))}
        </div>
        <div style={{flex:1}} />
        {markers.length>0&&(
          <div className="progress" title={statusCounts.done+" of "+markers.length+" shots done"}>
            <div className="progress-bar"><div style={{width:donePct+"%"}} /></div>
            <span className="mono">{statusCounts.done}/{markers.length} done</span>
          </div>
        )}
        <div className="btn-group">
          <button className="btn btn-sm btn-ghost" onClick={undo} disabled={!history.current.length} title="Undo (⌘Z)">↶</button>
          <button className="btn btn-sm btn-ghost" onClick={redo} disabled={!future.current.length} title="Redo (⌘⇧Z)">↷</button>
        </div>
        <button className="btn btn-sm" onClick={()=>setProjOpen(true)}>Projects</button>
        <button className="btn btn-sm" onClick={()=>setTagsOpen(true)}>Tags</button>
        <MenuButton className="btn btn-sm" title="Import a script, tag list or project"
          label={<>Import <span className="dd-caret">▾</span></>} items={importItems} />
        <MenuButton className="btn btn-sm" title="Export for animators, editors or backup"
          label={<>Export <span className="dd-caret">▾</span></>} items={exportItems} />
        {user?(
          <MenuButton className="btn btn-sm" title={"Signed in as "+user.email}
            style={{borderColor:"var(--ok)",color:"var(--ok)"}}
            label={<>{syncing?"Syncing…":"Cloud ✓"} <span className="dd-caret">▾</span></>}
            items={[
              { head:user.email },
              { label:"Sync now", hint:"↑↓", onClick:()=>syncCloud() },
              { label:"Cloud settings", onClick:()=>setCloudOpen(true) },
              { sep:true },
              { label:"Sign out", onClick:signOut },
            ]} />
        ):(
          <button className="btn btn-sm" onClick={()=>setCloudOpen(true)} title="Set up cloud sync"
            style={{borderColor:"var(--line)",color:"var(--muted)"}}>Sign in</button>
        )}
        <button className="btn btn-sm btn-ghost" onClick={()=>setHelpOpen(true)} title="Formats & shortcuts">?</button>
      </header>
      )}
      <input ref={txtRef} type="file" accept=".txt,.srt,.vtt,.md,text/plain" onChange={openTxt} style={{display:"none"}} />
      <input ref={tagTxtRef} type="file" accept=".txt,text/plain" onChange={openTagTxt} style={{display:"none"}} />
      <input ref={jsonRef} type="file" accept=".json,application/json" onChange={importProject} style={{display:"none"}} />

      {view==="script"&&isPhone&&(
        <div className="pane-switch">
          <button className={phonePane==="script"?"on":""} onClick={()=>setPhonePane("script")}>
            Script<span className="mono">{cues.filter((c)=>c.kind==="line").length}</span></button>
          <button className={phonePane==="shots"?"on":""} onClick={()=>setPhonePane("shots")}>
            Shot list<span className="mono">{markers.length}</span></button>
        </div>
      )}

      {/* ---------- body ---------- */}
      {view==="script" && (
        <div ref={bodyRef} className="split" style={{flex:1,display:"flex",minHeight:0}}>
          <section style={{flexBasis:isPhone?"100%":ui.splitPct+"%",flexGrow:isPhone?1:0,flexShrink:1,minWidth:isPhone?0:260,
                           display:isPhone&&phonePane!=="script"?"none":"flex",flexDirection:"column",minHeight:0}}>
            <div className="pane-head">
              <h2>Script</h2>
              <span style={{color:"var(--dim)",fontSize:12}}>
                {cues.length?timedCount+" timed":"empty"}{selCount?" · "+selCount+" selected":""}
                {query.trim()?" · "+visibleCues.length+" found":""}
              </span>
              {selCount>0&&(
                <>
                  <button className="btn btn-xs btn-ghost" onClick={()=>setSel([])} style={{color:"var(--muted)"}}>clear</button>
                  <button className="btn btn-xs btn-ghost" onClick={deleteSelected} style={{color:"var(--bad)"}}>delete</button>
                </>
              )}
              {isPhone&&(
                <button className={"btn btn-xs "+(selectMode?"btn-primary":"btn-ghost")}
                  onClick={()=>setSelectMode((v)=>!v)} title="Tap lines to add or remove them from the selection">
                  {selectMode?"Done":"Select"}
                </button>
              )}
              <div style={{flex:1}} />
              <button className="btn btn-xs btn-ghost" onClick={()=>setUi({scriptSize:clamp(ui.scriptSize-1,11,30)})}>A−</button>
              <button className="btn btn-xs btn-ghost" onClick={()=>setUi({scriptSize:clamp(ui.scriptSize+1,11,30)})}>A+</button>
              <button className="btn btn-sm btn-ghost" onClick={()=>setFollow((v)=>!v)}
                style={{borderColor:follow?"var(--accent)":"var(--line)",color:follow?"var(--accent)":"var(--muted)"}}>Follow</button>
              <input className="field" value={query} onChange={(e)=>setQuery(e.target.value)}
                placeholder="Search…" dir="auto" style={{width:120,padding:"4px 9px",fontSize:12}} />
            </div>
            <div className="pane" ref={scriptPane}
              onScroll={()=>{ if(Date.now()-autoScroll.current>900&&follow&&playing) setFollow(false); }}
              style={{flex:1}}>
              {cues.length===0?(
                <div className="onboard enter">
                  <div className="onboard-title">Start a project</div>
                  <ol>
                    <li><b>Load the narration</b> — audio or video, any length.
                      <button className="btn btn-xs" onClick={()=>fileRef.current&&fileRef.current.click()}>{audioUrl?"Change audio":"Load audio"}</button></li>
                    <li><b>Add the script</b> — paste it, or drop a .txt / .srt anywhere on the page.
                      <button className="btn btn-xs btn-primary" onClick={()=>{setImportText("");setImportOpen(true);}}>Paste a script</button></li>
                    <li><b>Tag the shots</b> — select lines or drag across the waveform, then press 1–9.</li>
                  </ol>
                  <div style={{fontSize:12,color:"var(--dim)"}}>Press <b>?</b> for file formats and every shortcut.</div>
                </div>
              ):visibleCues.map((c)=>{
                const i=cueIndex[c.id];
                const isActive=i===activeIdx, isSel=sel.indexOf(c.id)>=0, isPast=activeIdx>=0&&i<activeIdx;
                const mk=markersByCue[c.id]||[];
                const anns=[]; mk.forEach((m)=>(m.annotations||[]).forEach((a)=>{ if(a.cueId===c.id) anns.push(a); }));
                return (
                  <div key={c.id} ref={(el)=>cueRefs.current[i]=el}
                    className={"cue"+(isActive?" active":"")+(isSel?" sel":"")+(isPast?" past":"")+(c.kind==="head"?" head":"")}
                    onMouseDown={(e)=>{ if(editCue!==c.id&&(e.shiftKey||e.metaKey||e.ctrlKey)) e.preventDefault(); }}
                    onClick={(e)=>editCue!==c.id&&clickCue(c,i,e)}
                    onDoubleClick={()=>setEditCue(c.id)}>
                    <span className="mono cue-time">{c.start!==null?clock(c.start+offset):"—"}</span>
                    {editCue===c.id?(
                      <CueEditor cue={c} onSave={saveCue} onCancel={()=>setEditCue(null)} size={ui.scriptSize} />
                    ):(
                      <span className="cue-text" dir={hasArabic(c.text)?"rtl":"ltr"}
                        style={{textAlign:"start",
                                fontSize:c.kind==="head"?ui.scriptSize+3:ui.scriptSize,
                                fontStyle:c.kind==="note"?"italic":"normal",
                                color:c.kind==="note"?"var(--muted)":undefined}}>
                        <AnnotatedText text={c.text} anns={anns} titles />
                        {mk.length>0&&(
                          <span style={{display:"inline-flex",gap:4,marginInlineStart:9,verticalAlign:"middle"}}>
                            {mk.map((m)=>{ const t=tagOf(m.tagId);
                              return <span key={m.id} className="chip" title="Show this tag in the shot list"
                                onClick={(e)=>{e.stopPropagation(); jumpToGroup((m.cueIds||[]).slice().sort().join("|")||"free:"+m.id);}}
                                style={{background:t.color+"22",color:t.color,cursor:"pointer",
                                        opacity:(m.status||"todo")==="done"?.55:1}}>
                                <span className="dot" style={{background:t.color}} />{t.label}
                              </span>; })}
                          </span>
                        )}
                      </span>
                    )}
                  </div>
                );
              })}
            </div>
          </section>

          {!isPhone&&<div className="grip" onPointerDown={startSplit} />}

          <section style={{flex:1,minWidth:isPhone?0:260,display:isPhone&&phonePane!=="shots"?"none":"flex",
                           flexDirection:"column",minHeight:0}}>
            <div className="pane-head">
              <h2>Shot list</h2>
              <span style={{color:"var(--dim)",fontSize:12}}>{markers.length}</span>
              <div className="seg" title="Shot list density">
                {[["compact","Compact"],["comfortable","Comfortable"],["expanded","Expanded"]].map(([k,l])=>(
                  <button key={k} className={shotMode===k?"on":""} onClick={()=>setUi({shotMode:k})}>{l}</button>
                ))}
              </div>
              <div style={{flex:1}} />
              {gaps.length>0&&(
                <button className="btn btn-xs btn-ghost" onClick={()=>setGapsOpen((v)=>!v)}
                  style={{borderColor:gapsOpen?"var(--warn)":"var(--line)",color:"var(--warn)"}}>
                  {gaps.length} gap{gaps.length>1?"s":""}
                </button>
              )}
            </div>
            {markers.length>0&&(
              <div className="filters">
                {tags.filter((t)=>counts[t.id]).map((t)=>(
                  <button key={t.id} className="fchip" onClick={()=>setFilter(filter===t.id?null:t.id)}
                    style={filter===t.id?{borderColor:t.color,color:t.color,background:t.color+"1A"}:undefined}>
                    <span className="dot" style={{background:t.color}} />{t.label}<span className="mono fcount">{counts[t.id]}</span>
                  </button>
                ))}
                <span className="fsep" />
                {STATUS.map((s)=>statusCounts[s.id]>0?(
                  <button key={s.id} className="fchip" onClick={()=>setStatusFilter(statusFilter===s.id?null:s.id)}
                    style={statusFilter===s.id?{borderColor:s.color,color:s.color,background:s.color+"1A"}:undefined}>
                    <span className="dot" style={{background:s.color,borderRadius:"50%"}} />{s.label}<span className="mono fcount">{statusCounts[s.id]}</span>
                  </button>
                ):null)}
                {(filter||statusFilter)&&(
                  <button className="btn btn-xs btn-ghost" style={{color:"var(--muted)"}}
                    onClick={()=>{ setFilter(null); setStatusFilter(null); }}>Clear</button>
                )}
              </div>
            )}
            <div className="pane shots" style={{flex:1}}>
              {gapsOpen&&(
                <div className="enter" style={{background:"var(--panel)",border:"1px solid var(--line)",
                  borderInlineStart:"3px solid var(--warn)",borderRadius:8,padding:11,marginBottom:10}}>
                  <div style={{fontSize:12,color:"var(--muted)",marginBottom:7}}>Over 20s with nothing tagged.</div>
                  {gaps.map((g,i)=>(
                    <button key={i} className="btn btn-xs btn-ghost mono"
                      onClick={()=>{ seek(g[0]); setRegion({a:g[0],b:g[1]}); }}
                      style={{marginInlineEnd:6,marginBottom:5}}>
                      {clock(g[0])} – {clock(g[1])} · {Math.round(g[1]-g[0])}s
                    </button>
                  ))}
                </div>
              )}
              {groups.length===0?(
                <div style={{color:"var(--dim)",lineHeight:1.9,maxWidth:400}}>
                  {markers.length?(
                    <p>No tags match the filter. <button className="btn btn-xs" onClick={()=>{ setFilter(null); setStatusFilter(null); }}>Show all</button></p>
                  ):(<>
                    <p>Nothing tagged yet.</p>
                    <p>Select lines and press a number key, or drag a region on the waveform and tag that.</p>
                  </>)}
                </div>
              ):(
                <div className={shotMode==="compact"?"shot-grid":""}>

/* =============== themed dropdown & date picker ===============
   Native <select> lists and date pickers open white on the dark theme and
   can't be styled, so both are drawn here. The popover is portalled to
   <body> with position:fixed, so a scrolling pane never clips it.          */
function usePopover(keepLtr){
  const btnRef=useRef(null), popRef=useRef(null);
  const [open,setOpen]=useState(false);
  const [,bump]=useState(0);
  useEffect(()=>{
    if(!open) return;
    const inside=(t)=>(popRef.current&&popRef.current.contains(t))||(btnRef.current&&btnRef.current.contains(t));
    const away=(e)=>{ if(!inside(e.target)) setOpen(false); };
    const moved=()=>bump((n)=>n+1);
    document.addEventListener("mousedown",away,true);
    window.addEventListener("scroll",moved,true);
    window.addEventListener("resize",moved);
    return ()=>{ document.removeEventListener("mousedown",away,true);
                 window.removeEventListener("scroll",moved,true); window.removeEventListener("resize",moved); };
  },[open]);
  // under the button (above it if there's no room), kept inside the viewport
  useLayoutEffect(()=>{
    const p=popRef.current, b=btnRef.current; if(!open||!p||!b) return;
    const rtl=!keepLtr&&getComputedStyle(b).direction==="rtl";
    p.dir=rtl?"rtl":"ltr";
    const r=b.getBoundingClientRect(), h=p.offsetHeight, w=Math.max(p.offsetWidth,r.width);
    let top=r.bottom+4; if(top+h>window.innerHeight-8&&r.top-h-4>8) top=r.top-h-4;
    const left=clamp(rtl?r.right-w:r.left,8,Math.max(8,window.innerWidth-w-8));
    p.style.top=top+"px"; p.style.left=left+"px"; p.style.minWidth=r.width+"px";
  });
  return { btnRef, popRef, open, setOpen };
}

// options: [{ value, label, color?, round? }] — color draws a swatch (round = status dot)
function Dropdown({ value, options, onChange, className, style, title }){
  const { btnRef, popRef, open, setOpen }=usePopover(false);
  const [hot,setHot]=useState(-1);
  const cur=options.find((o)=>String(o.value)===String(value))||options[0];
  const curIdx=Math.max(0,options.indexOf(cur));
  const pick=(o)=>{ setOpen(false); if(String(o.value)!==String(value)) onChange(o.value); if(btnRef.current) btnRef.current.focus(); };
  const swatch=(o)=>o&&o.color?<span className="dot" style={{background:o.color,borderRadius:o.round?"50%":2}} />:null;
  const onKey=(e)=>{
    const k=e.key;
    if(!open){
      if(k==="ArrowDown"||k==="ArrowUp"||k==="Enter"||k===" "){ e.preventDefault(); e.stopPropagation(); setHot(curIdx); setOpen(true); }
      return;
    }
    if(k==="Escape"){ e.preventDefault(); e.stopPropagation(); setOpen(false); }
    else if(k==="ArrowDown"){ e.preventDefault(); e.stopPropagation(); setHot((h)=>Math.min(options.length-1,h+1)); }
    else if(k==="ArrowUp"){ e.preventDefault(); e.stopPropagation(); setHot((h)=>Math.max(0,h-1)); }
    else if(k==="Enter"||k===" "){ e.preventDefault(); e.stopPropagation(); if(options[hot]) pick(options[hot]); }
    else if(k==="Tab") setOpen(false);
  };
  return (<>
    <button ref={btnRef} type="button" className={"dd-btn "+(className||"")} style={style} title={title}
      aria-haspopup="listbox" aria-expanded={open}
      onClick={()=>{ setHot(curIdx); setOpen((v)=>!v); }} onKeyDown={onKey}>
      {swatch(cur)}<span dir="auto">{cur?cur.label:""}</span><span className="dd-caret">▾</span>
    </button>
    {open&&ReactDOM.createPortal(
      <div ref={popRef} className="pop fade" role="listbox" style={{top:-9999,left:-9999}}>
        {options.map((o,i)=>(
          <button key={String(o.value)} type="button" role="option" aria-selected={o===cur} tabIndex={-1}
            className={"pop-item"+(o===cur?" on":"")+(i===hot?" hot":"")}
            onMouseEnter={()=>setHot(i)} onClick={()=>pick(o)}>
            {swatch(o)}<span dir="auto">{o.label}</span>
          </button>
        ))}
      </div>, document.body)}
  </>);
}

const parseISODate=(s)=>{ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||""); return m?new Date(+m[1],+m[2]-1,+m[3]):null; };

// value / onChange use "YYYY-MM-DD" local dates (localISO — never toISOString, see CLAUDE.md)
function DatePicker({ value, onChange, className, style, placeholder, title }){
  const { btnRef, popRef, open, setOpen }=usePopover(true);
  const [cursor,setCursor]=useState(()=>{ const b=parseISODate(value)||new Date(); return new Date(b.getFullYear(),b.getMonth(),1); });
  useEffect(()=>{ if(open){ const b=parseISODate(value)||new Date(); setCursor(new Date(b.getFullYear(),b.getMonth(),1)); } },[open]);
  const y=cursor.getFullYear(), mo=cursor.getMonth(), startDow=(new Date(y,mo,1).getDay()+6)%7;   // Monday first
  const cells=[]; for(let i=0;i<42;i++) cells.push(new Date(y,mo,1-startDow+i));
  const t=today();
  const pick=(v)=>{ setOpen(false); if(v!==(value||"")) onChange(v); if(btnRef.current) btnRef.current.focus(); };
  return (<>
    <button ref={btnRef} type="button" className={"dd-btn mono "+(className||"")} style={style} title={title} dir="ltr"
      aria-haspopup="dialog" aria-expanded={open}
      onClick={()=>setOpen((v)=>!v)}
      onKeyDown={(e)=>{ if(open&&e.key==="Escape"){ e.preventDefault(); e.stopPropagation(); setOpen(false); } }}>
      <span>{value||placeholder||"No date"}</span><span className="dd-caret">▾</span>
    </button>
    {open&&ReactDOM.createPortal(
      <div ref={popRef} className="pop fade" role="dialog" style={{top:-9999,left:-9999,padding:8}}>
        <div style={{display:"flex",alignItems:"center",gap:4,marginBottom:6}}>
          <button type="button" className="btn btn-xs btn-ghost" onClick={()=>setCursor(new Date(y,mo-1,1))}>←</button>
          <span style={{flex:1,textAlign:"center",fontSize:12,fontWeight:600}}>
            {cursor.toLocaleString("en",{month:"long",year:"numeric"})}
          </span>
          <button type="button" className="btn btn-xs btn-ghost" onClick={()=>setCursor(new Date(y,mo+1,1))}>→</button>
        </div>
        <div className="dp-grid">
          {["Mo","Tu","We","Th","Fr","Sa","Su"].map((d)=>(
            <div key={d} style={{fontSize:10,color:"var(--dim)",textAlign:"center",padding:"2px 0"}}>{d}</div>
          ))}
          {cells.map((c)=>{ const iso=localISO(c);
            return <button key={iso} type="button"
              className={"dp-day mono"+(c.getMonth()!==mo?" out":"")+(iso===t?" today":"")+(iso===value?" on":"")}
              onClick={()=>pick(iso)}>{c.getDate()}</button>; })}
        </div>
        <div style={{display:"flex",gap:6,marginTop:8}}>
          <button type="button" className="btn btn-xs" onClick={()=>pick(t)}>Today</button>
          <div style={{flex:1}} />
          {value&&<button type="button" className="btn btn-xs btn-ghost" style={{color:"var(--muted)"}}
            onClick={()=>pick("")}>Clear</button>}
        </div>
      </div>, document.body)}
  </>);
}

// a small menu on the shared popover: Import / Export, and the phone ☰ menu
function MenuButton({ label, items, className, title, style }){
  const { btnRef, popRef, open, setOpen }=usePopover(false);

  return (<>
    <button ref={btnRef} type="button" className={"dd-btn "+(className||"")} style={style} title={title}
      aria-haspopup="menu" aria-expanded={open} onClick={()=>setOpen((v)=>!v)}
      onKeyDown={(e)=>{ if(open&&e.key==="Escape"){ e.preventDefault(); e.stopPropagation(); setOpen(false); } }}>
      {label}
    </button>
    {open&&ReactDOM.createPortal(
      <div ref={popRef} className="pop fade" role="menu" style={{top:-9999,left:-9999}}>
        {list.map((it,i)=>it.sep?<div key={i} className="pop-sep" />:it.head?<div key={i} className="pop-head">{it.head}</div>:(
          <button key={i} type="button" role="menuitem" className="pop-item" disabled={!!it.disabled}
            onClick={()=>{ setOpen(false); it.onClick(); }}>
            <span dir="auto" style={{flex:1}}>{it.label}</span>{it.hint&&<span className="pop-hint">{it.hint}</span>}
          </button>
        ))}

/* =============== annotated text =============== */
// titles: native tooltips (script pane); the shot list draws its own hover notes instead
function AnnotatedText({ text, anns, selectedId, selGroup, titles }) {
  if(!anns||!anns.length) return <>{text}</>;
  return <>{segments(text,anns).map((sg,i)=>{
    if(!sg.anns.length) return <React.Fragment key={i}>{sg.text}</React.Fragment>;
    const a=sg.anns[sg.anns.length-1];
    const st={ };
    if(a.style==="highlight") st.background=a.color+"55";
    if(a.style==="underline") st.borderBottom="2px solid "+a.color;
    if(a.style==="strike") { st.textDecoration="line-through"; st.textDecorationColor=a.color; }
    // a highlight that runs across lines is stored as one part per line, tied by `group`
    const on=sg.anns.some((x)=>x.id===selectedId||(selGroup&&x.group===selGroup));
    return <span key={i} className={"ann"+(on?" ann-sel":"")} style={st} data-annid={on?selectedId:a.id}
      title={titles?sg.anns.map((x)=>x.note||x.style).join(" · "):undefined}>{sg.text}</span>;
  })}</>;
}

/* =============== compact tile (shot list "Compact" view) =============== */
function ShotTile({ gr, gi, tagOf, cues, cueIndex, onOpen, onSeek }){
  const first=gr.items[0];
  const text=(first.cueIds||[]).map((id)=>(cues[cueIndex[id]]||{}).text).filter(Boolean).join(" ");
  const brief=briefText(first);
  const allDone=gr.items.every((m)=>(m.status||"todo")==="done");
  return (
    <div className="tile enter" role="button" tabIndex={0} onClick={onOpen} data-gkey={gr.key} title="Open this shot"
      onKeyDown={(e)=>{ if(e.key==="Enter"){ e.preventDefault(); e.stopPropagation(); onOpen(); } }}
      style={{borderInlineStart:"3px solid "+(gr.items.length>1?"var(--accent)":tagOf(first.tagId).color),opacity:allDone?.68:1}}>
      <div style={{display:"flex",alignItems:"center",gap:6}}>
        <span className="mono" style={{fontSize:11,color:"var(--dim)"}}>{gi+1}</span>
        <button className="btn btn-xs btn-ghost mono" style={{fontSize:11}}
          onClick={(e)=>{ e.stopPropagation(); onSeek(gr.start); }}>{clock(gr.start)}</button>
        <span className="mono dur" title="How long this shot runs">{durText(gr.end-gr.start)}</span>
        <div style={{flex:1}} />
        {gr.items.map((m)=>{ const s=STATUS.find((x)=>x.id===(m.status||"todo"))||STATUS[0];
          return <span key={m.id} className="dot" title={s.label} style={{background:s.color,borderRadius:"50%"}} />; })}
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:4,marginTop:5}}>
        {gr.items.map((m)=>{ const t=tagOf(m.tagId);
          return <span key={m.id} className="chip" style={{background:t.color+"22",color:t.color}}>
            <span className="dot" style={{background:t.color}} />{t.label}</span>; })}
      </div>
      {(brief||text)&&<div className="tile-text" dir="auto" style={brief?{color:"var(--text)"}:undefined}>{brief||text}</div>}
    </div>
  );
}
