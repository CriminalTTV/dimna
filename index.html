function GroupCard(props){
  const { gr,gi,tags,tagOf,fps,cues,cueIndex,expanded,onToggle,onSeek,onSelectLines,flash,
          onUpdate,onDelete,onAddComment,onEditComment,onDelComment,onAddAnnotation,onUpdAnnotation,onDelAnnotation,
          annotId,setAnnotId,sel,onRelink,mode,onCollapse,onPlay,live,rangeOf } = props;
  const multi=gr.items.length>1;
  const editing=gr.items.find((m)=>m.id===annotId)||null;   // tag in annotation mode, if it's in this folder
  const open=expanded||!multi||!!editing||mode==="expanded"||mode==="compact";   // an opened tile shows every tag
  const cueIds=gr.items[0].cueIds||[];
  const lines=cueIds.map((id)=>cues[cueIndex[id]]).filter(Boolean);
  const span=tc(gr.start,fps)+(gr.end>gr.start+0.05?"  →  "+tc(gr.end,fps):"");
  const allDone=gr.items.every((m)=>(m.status||"todo")==="done");
  // outside annotation mode show every tag's highlights; inside it, only the tag being annotated
  const shown=useMemo(()=>editing?(editing.annotations||[]):
    [].concat(...gr.items.map((m)=>(m.annotations||[]).map((a)=>multi?Object.assign({},a,{_tag:tagOf(m.tagId).label}):a))),
  [editing,gr.items,multi,tagOf]);
  // lines selected in the script pane that a tag doesn't have yet (item 7)
  const addableFor=(m)=>(sel||[]).filter((id)=>(m.cueIds||[]).indexOf(id)<0&&cues[cueIndex[id]]&&cues[cueIndex[id]].kind==="line");

  return (
    <div className={"gcard enter"+(editing?" annotating":"")+(live?" live":"")} data-gkey={gr.key}
      style={{borderInlineStart:"3px solid "+(multi?"var(--accent)":tagOf(gr.items[0].tagId).color),
              opacity:allDone&&!editing?.72:1}}>
      <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
        <span className="mono" style={{color:"var(--dim)",fontSize:11,minWidth:15}}>{gi+1}</span>
        <button className="btn btn-xs btn-ghost mono" onClick={()=>onSeek(gr.start)} style={{fontSize:12}} title="Jump here">{span}</button>
        <span className="mono dur" title="How long this shot runs">{durText(gr.end-gr.start)}</span>
        <button className="btn btn-xs btn-ghost" onClick={onPlay||undefined} disabled={!onPlay}
          title={onPlay?"Play just this shot":"Load audio to play shots"} style={{color:"var(--accent)"}}>▶</button>
        {live&&<span className="live-dot" title="Playing now">●</span>}
        {multi&&(
          <button className="btn btn-xs btn-ghost" onClick={onToggle} style={{color:"var(--accent)"}}>
            {open?"▾":"▸"} {gr.items.length} tags
          </button>
        )}
        {!open&&multi&&(
          <span style={{display:"inline-flex",gap:4}}>
            {gr.items.map((m)=><span key={m.id} className="dot"
              style={{background:tagOf(m.tagId).color,width:9,height:9}} />)}
          </span>
        )}
        <div style={{flex:1}} />
        {cueIds.length>0&&(
          <button className="btn btn-xs btn-ghost" style={{color:"var(--dim)"}}
            onClick={()=>onSelectLines(cueIds)}>select lines</button>
        )}
        {onCollapse&&!editing&&(
          <button className="btn btn-xs btn-ghost" style={{color:"var(--muted)"}} onClick={onCollapse} title="Back to a tile">▴</button>
        )}
      </div>

      {editing&&(
        <div className="fade" style={{display:"flex",alignItems:"center",gap:8,marginTop:10,fontSize:12,color:"var(--accent)"}}>
          <span className="dot" style={{background:tagOf(editing.tagId).color}} />
          <span style={{flex:1}}>
            Annotating <b>{tagOf(editing.tagId).label}</b> — select text to highlight · click a highlight to add a note · Delete removes it
          </span>
          <button className="btn btn-xs btn-primary" onClick={()=>setAnnotId(null)}>Done</button>
        </div>
      )}

      <div className={"gbody"+(lines.length>0&&open?" two":"")}>
      <div className="gcol-lines">
      {lines.length>0&&(
        <AnnotatableLines lines={lines} anns={shown} editable={!!editing} size={editing?17:15}
          removeLabel={editing?"Remove this line from "+tagOf(editing.tagId).label:null}
          onRemoveLine={editing&&(Number.isFinite(editing.start)||lines.length>1)
            ?(id)=>onRelink(editing,(editing.cueIds||[]).filter((x)=>x!==id)):null}
          onAdd={(a)=>editing&&onAddAnnotation(editing,a)}
          onUpdate={(aid,p)=>editing&&onUpdAnnotation(editing,aid,p)}
          onDelete={(aid)=>editing&&onDelAnnotation(editing,aid)} />
      )}
      {mode==="expanded"&&!editing&&(()=>{
        // Expanded view spells out every highlight note instead of leaving them to hover
        const notes=shown.filter((a)=>a.note&&cues[cueIndex[a.cueId]]);
        return notes.length>0&&(
          <div className="ann-notes">
            {notes.map((a)=>{ const c=cues[cueIndex[a.cueId]];
              return <div key={a.id} className="ann-note">
                <span className="ann-q" dir="auto" style={{background:a.style==="highlight"?a.color+"40":"transparent",
                  borderBottom:a.style==="underline"?"2px solid "+a.color:undefined,
                  textDecoration:a.style==="strike"?"line-through":undefined}}>“{c.text.slice(a.s,a.e)}”</span>
                <span dir="auto">{a._tag?a._tag+" · ":""}{a.note}</span>
              </div>; })}
          </div>
        );
      })()}
      </div>
      <div className="gcol-tags">

      {open&&gr.items.map((m)=>(
        <MarkerBlock key={m.id} m={m} tags={tags} tagOf={tagOf} flash={flash===m.id}
          onUpdate={onUpdate} onDelete={onDelete}
          onAddComment={onAddComment} onEditComment={onEditComment} onDelComment={onDelComment}
          canAnnotate={lines.length>0} annotating={m.id===annotId}
          onAnnotate={()=>setAnnotId(m.id===annotId?null:m.id)}
          addable={addableFor(m)} onAddLines={()=>onRelink(m,(m.cueIds||[]).concat(addableFor(m)))}
          showAll={mode==="expanded"} tagRange={rangeOf?rangeOf(m):null} />
      ))}
      </div>
      </div>
    </div>
  );
}

/* =============== annotatable script lines ===============
   Acrobat-style: in annotation mode, select text → pick a tool; click an
   existing highlight → popup for its note / colour / style; Delete removes
   the picked highlight; hovering shows its note.                          */
function AnnotatableLines({ lines, anns, editable, size, onAdd, onUpdate, onDelete, onRemoveLine, removeLabel }){
  const ref=useRef(null), noteRef=useRef(null);
  const [tool,setTool]=useState(null);       // pending text selection {cueId,s,e,x,y}
  const [picked,setPicked]=useState(null);   // highlight picked by a click {id,x,y}
  const [draft,setDraft]=useState("");
  const [tip,setTip]=useState(null);         // hover note {id,x,y,text}
  const byId=useMemo(()=>{ const o={}; anns.forEach((a)=>{ o[a.id]=a; }); return o; },[anns]);
  const cur=picked?byId[picked.id]:null;

  useEffect(()=>{ if(!editable){ setTool(null); setPicked(null); } },[editable]);
  useEffect(()=>{ if(picked&&!byId[picked.id]) setPicked(null); },[byId,picked]);

  // read the text selection. With a mouse the toolbar goes where the button came up; for a touch
  // selection (handles, no mouseup) it goes under the selected words
  const grab=(e)=>{
    if(!editable||!ref.current) return;
    const selection=window.getSelection();
    if(!selection||selection.isCollapsed||!selection.rangeCount){ setTool(null); return; }
    const r=selection.getRangeAt(0);
    if(!ref.current.contains(r.commonAncestorContainer)){ setTool(null); return; }
    // a selection can run across several lines — one part per line it touches
    const parts=[];
    ref.current.querySelectorAll("[data-cueid]").forEach((el)=>{
      if(!r.intersectsNode(el)) return;
      const len=el.textContent.length;
      const s=el.contains(r.startContainer)?offsetIn(el,r.startContainer,r.startOffset):0;
      const en=el.contains(r.endContainer)?offsetIn(el,r.endContainer,r.endOffset):len;
      const a=clamp(Math.min(s,en),0,len), b=clamp(Math.max(s,en),0,len);
      if(b-a>=1) parts.push({ cueId:el.dataset.cueid, s:a, e:b });
    });
    if(!parts.length){ setTool(null); return; }
    const box=ref.current.getBoundingClientRect(), rr=r.getBoundingClientRect();
    const x=e&&e.clientX!=null?e.clientX-box.left:rr.left+rr.width/2-box.left;
    const y=e&&e.clientY!=null?e.clientY-box.top:rr.bottom-box.top;
    const key=parts.map((p)=>p.cueId+":"+p.s+"-"+p.e).join("|");
    setPicked(null);
    setTool((prev)=>prev&&prev.key===key?prev:{ parts, key, x, y });
  };
  const grabRef=useRef(null); grabRef.current=grab;
  useEffect(()=>{
    if(!editable||!(window.matchMedia&&window.matchMedia("(pointer:coarse)").matches)) return;
    let t=0;
    const onSel=()=>{ clearTimeout(t); t=setTimeout(()=>grabRef.current&&grabRef.current(null),350); };
    document.addEventListener("selectionchange",onSel);
    return ()=>{ clearTimeout(t); document.removeEventListener("selectionchange",onSel); };
  },[editable]);
  const apply=(style,color)=>{
    if(!tool) return;
    const group=tool.parts.length>1?uid():null;   // one highlight, several lines
    onAdd(tool.parts.map((p)=>Object.assign({ style, color, note:"" }, p, group?{ group }:{})));
    window.getSelection().removeAllRanges();
    setTool(null);
  };

  const saveNote=()=>{ if(cur&&draft.trim()!==(cur.note||"")) onUpdate(cur.id,{ note:draft.trim() }); };
  const letGo=()=>{ saveNote(); setPicked(null); };
  const pick=(e)=>{
    if(!editable) return;
    const sel=window.getSelection(); if(sel&&!sel.isCollapsed) return;
    const el=e.target.closest?e.target.closest("[data-annid]"):null;
    if(!el){ if(picked) letGo(); return; }
    const a=byId[el.dataset.annid]; if(!a) return;
    if(picked&&picked.id!==a.id) saveNote();
    const r=el.getBoundingClientRect(), box=ref.current.getBoundingClientRect();
    setTool(null); setTip(null); setDraft(a.note||"");
    setPicked({ id:a.id, x:r.left-box.left+r.width/2, y:r.bottom-box.top });
  };

  // while a highlight is picked: Delete / Backspace remove it, Esc lets go, and
  // typing goes into its note — none of these reach the global shortcuts
  useEffect(()=>{
    if(!picked) return;
    const onKey=(e)=>{
      const t=e.target;
      if(t&&(t.tagName==="TEXTAREA"||t.tagName==="INPUT")) return;
      if(e.key==="Delete"||e.key==="Backspace"){ e.preventDefault(); e.stopPropagation(); onDelete(picked.id); setPicked(null); }
      else if(e.key==="Escape"){ e.preventDefault(); e.stopPropagation(); letGo(); }
      else if(e.key.length===1&&!e.metaKey&&!e.ctrlKey&&!e.altKey){ e.stopPropagation(); if(noteRef.current) noteRef.current.focus(); }
    };
    const away=(e)=>{ if(ref.current&&!ref.current.contains(e.target)) letGo(); };
    window.addEventListener("keydown",onKey,true);
    document.addEventListener("mousedown",away,true);
    return ()=>{ window.removeEventListener("keydown",onKey,true); document.removeEventListener("mousedown",away,true); };
  });

  const hover=(e)=>{
    const el=e.target.closest?e.target.closest("[data-annid]"):null;
    const a=el?byId[el.dataset.annid]:null;
    if(!a){ if(tip) setTip(null); return; }
    if(tip&&tip.id===a.id) return;
    const text=a.note?(a._tag?a._tag+" · ":"")+a.note:(editable?"Click to add a note":"");
    if(!text){ if(tip) setTip(null); return; }
    const r=el.getBoundingClientRect();
    setTip({ id:a.id, x:r.left+r.width/2, y:r.top, text });
  };
  const pos=(x,w)=>clamp(x-w/2,0,Math.max(0,(ref.current?ref.current.clientWidth:w)-w));

  return (
    <div ref={ref} className={"ann-area"+(editable?" ann-edit":"")} style={{position:"relative",marginTop:8}}
      onMouseUp={grab} onClick={pick} onMouseOver={hover} onMouseLeave={()=>setTip(null)}>
      {lines.map((c)=>(
        <div key={c.id} style={{display:"flex",alignItems:"baseline",gap:6}}>
          <div data-cueid={c.id} dir={hasArabic(c.text)?"rtl":"ltr"}
            style={{flex:1,fontSize:size||15,color:editable?"var(--text)":"var(--muted)",lineHeight:1.95,
                    textAlign:"start",transition:"font-size .16s ease, color .16s ease"}}>
              <AnnotatedText text={c.text} anns={anns.filter((a)=>a.cueId===c.id)}
              selectedId={picked&&picked.id} selGroup={cur&&cur.group} />
          </div>
          {onRemoveLine&&(
            <button className="btn btn-xs btn-ghost line-x" title={removeLabel||"Remove this line from the tag"}
              onClick={(e)=>{ e.stopPropagation(); onRemoveLine(c.id); }}>✕</button>
          )}
        </div>
      ))}

      {tool&&(
        <div className="enter" onMouseDown={(e)=>e.preventDefault()} onMouseUp={(e)=>e.stopPropagation()}
          onClick={(e)=>e.stopPropagation()}
          style={{position:"absolute",left:pos(tool.x,190),top:tool.y+12,zIndex:30,
          background:"var(--raise)",border:"1px solid var(--line2)",borderRadius:8,padding:6,
          display:"flex",gap:5,alignItems:"center",boxShadow:"0 8px 24px rgba(0,0,0,.5)"}}>
          {HL.map((c)=>(
            <button key={c} onClick={()=>apply("highlight",c)} title="Highlight"
              style={{width:18,height:18,borderRadius:4,background:c,border:"none",padding:0}} />
          ))}
          <button className="btn btn-xs btn-ghost" onClick={()=>apply("underline",HL[2])} title="Underline"
            style={{textDecoration:"underline"}}>U</button>
          <button className="btn btn-xs btn-ghost" onClick={()=>apply("strike",HL[3])} title="Strikethrough"
            style={{textDecoration:"line-through"}}>S</button>
          <button className="btn btn-xs btn-ghost" onClick={()=>setTool(null)} style={{color:"var(--dim)"}}>✕</button>
        </div>
      )}

      {cur&&(
        <div className="enter" onMouseUp={(e)=>e.stopPropagation()} onClick={(e)=>e.stopPropagation()}
          style={{position:"absolute",left:pos(picked.x,270),top:picked.y+6,zIndex:31,width:270,
          background:"var(--raise)",border:"1px solid var(--line2)",borderRadius:8,padding:8,
          boxShadow:"0 8px 24px rgba(0,0,0,.5)"}}>
          <textarea ref={noteRef} className="field" rows={2} value={draft} dir="auto" placeholder="Add a note…"
            onChange={(e)=>setDraft(e.target.value)}
            onKeyDown={(e)=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); letGo(); }
                              if(e.key==="Escape"){ e.preventDefault(); e.stopPropagation(); setPicked(null); } }}
            style={{padding:"5px 8px",fontSize:13,lineHeight:1.6,resize:"none"}} />
          <div style={{display:"flex",gap:5,alignItems:"center",marginTop:6}}>
            {HL.map((c)=>(
              <button key={c} title="Colour" onClick={()=>onUpdate(cur.id,{color:c})}
                style={{width:16,height:16,borderRadius:4,background:c,padding:0,
                        border:cur.color===c?"2px solid var(--text)":"none"}} />
            ))}
            {[["highlight","H"],["underline","U"],["strike","S"]].map(([s,l])=>(
              <button key={s} className="btn btn-xs btn-ghost" title={s} onClick={()=>onUpdate(cur.id,{style:s})}
                style={{color:cur.style===s?"var(--accent)":"var(--muted)",
                        textDecoration:s==="underline"?"underline":s==="strike"?"line-through":"none"}}>{l}</button>
            ))}
            <div style={{flex:1}} />
            <button className="btn btn-xs btn-ghost" style={{color:"var(--bad)"}} title="Delete highlight (Delete key)"
              onClick={()=>{ onDelete(cur.id); setPicked(null); }}>Delete</button>
          </div>
          <div style={{fontSize:10,color:"var(--dim)",marginTop:4}}>enter saves · delete key removes the highlight</div>
        </div>
      )}

      {tip&&!(picked&&picked.id===tip.id)&&ReactDOM.createPortal(
        <div className="ann-tip" dir="auto" style={{left:tip.x,top:tip.y}}>{tip.text}</div>, document.body)}
    </div>
  );
}

/* =============== comments =============== */
// Enter saves and closes, shift+enter is a new line, esc cancels; clicking away keeps what was typed
function CommentComposer({ initial, brief, onSave, onCancel }){
  const [text,setText]=useState(initial||"");
  const done=useRef(false);
  const save=()=>{ if(done.current) return; done.current=true; if(text.trim()) onSave(text); else onCancel(); };
  const cancel=()=>{ done.current=true; onCancel(); };
  return (
    <div className="fade" style={{marginTop:7}}>
      <textarea autoFocus className="field" rows={brief?3:2} value={text} dir="auto"
        onChange={(e)=>setText(e.target.value)}
        onKeyDown={(e)=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); save(); }
                          else if(e.key==="Escape"){ e.preventDefault(); e.stopPropagation(); cancel(); } }}
        onBlur={save}
        placeholder={brief?"The main instruction for this shot…":"Add a comment…"}
        style={{fontSize:brief?15:13,lineHeight:1.7,padding:"7px 10px",resize:"vertical"}} />
      <div style={{display:"flex",gap:6,marginTop:5,alignItems:"center",fontSize:11,color:"var(--dim)",flexWrap:"wrap"}}>
        <button className="btn btn-xs btn-primary" onMouseDown={(e)=>e.preventDefault()} onClick={save}>{brief?"Save brief":"Save"}</button>
        <button className="btn btn-xs btn-ghost" onMouseDown={(e)=>e.preventDefault()} onClick={cancel}>Cancel</button>
        <span>enter saves · shift+enter new line · esc cancels</span>
      </div>
    </div>
  );
}

function CommentItem({ c, brief, onSave, onDelete }){
  const [editing,setEditing]=useState(false);
  if(editing) return <CommentComposer initial={c.text} brief={brief}
    onSave={(txt)=>{ onSave(txt); setEditing(false); }} onCancel={()=>setEditing(false)} />;
  return (
    <div className={"comment"+(brief?" brief":"")} onDoubleClick={()=>setEditing(true)} title="Double-click to edit">
      {brief&&<div className="brief-label">Brief</div>}
      <div style={{display:"flex",gap:6,alignItems:"flex-start"}}>
        <span dir="auto" style={{flex:1,whiteSpace:"pre-wrap",wordBreak:"break-word"}}>{c.text}</span>
        <button className="btn btn-xs btn-ghost c-act" title="Edit" onClick={()=>setEditing(true)}>✎</button>
        <button className="btn btn-xs btn-ghost c-act" title={brief?"Delete brief":"Delete comment"} onClick={onDelete}>✕</button>
      </div>
      {!brief&&c.at&&<div className="comment-at">{ago(c.at)}{c.edited?" · edited":""}</div>}
    </div>
  );
}

/* =============== marker block =============== */
function MarkerBlock({ m,tags,tagOf,flash,onUpdate,onDelete,onAddComment,onEditComment,onDelComment,canAnnotate,annotating,onAnnotate,addable,onAddLines,showAll,tagRange }){
  const t=tagOf(m.tagId);
  const [composer,setComposer]=useState(null);   // null | "brief" | "comment"
  const [unfold,setUnfold]=useState(false);
  const st=STATUS.find((s)=>s.id===(m.status||"todo"))||STATUS[0];
  const comments=m.comments||[];
  const brief=comments.find((c)=>c.brief)||null;
  const rest=comments.filter((c)=>!c.brief);
  const FOLD=3;   // outside the Expanded view, long threads show their latest few comments
  const visible=showAll||unfold||rest.length<=FOLD?rest:rest.slice(-FOLD);

  return (
    <div className={"mblock"+(flash?" pop":"")}
      style={annotating?{borderInlineStart:"3px solid "+t.color,paddingInlineStart:9,background:t.color+"10",borderRadius:6}:undefined}>
      <div style={{display:"flex",alignItems:"center",gap:7,flexWrap:"wrap"}}>
        <Dropdown className="btn btn-xs btn-ghost" value={m.tagId} title="Tag"
          options={tags.map((x)=>({ value:x.id, label:x.label, color:x.color }))}
          onChange={(v)=>onUpdate(m.id,{tagId:v})}
          style={{color:t.color,borderColor:t.color+"55"}} />
        <Dropdown className="btn btn-xs btn-ghost" value={m.status||"todo"} title="Status"
          options={STATUS.map((s)=>({ value:s.id, label:s.label, color:s.color, round:true }))}
          onChange={(v)=>onUpdate(m.id,{status:v})}
          style={{color:st.color,borderColor:st.color+"55"}} />
        {tagRange&&(
          <span className="mono dur" title={"This tag runs "+clock(tagRange.start)+" → "+clock(tagRange.end)}>
            {durText(tagRange.end-tagRange.start)}
          </span>
        )}
        <DatePicker className="btn btn-xs btn-ghost" value={m.due||""} placeholder="Due date" title="Due date"
          onChange={(v)=>onUpdate(m.id,{due:v})}
          style={{fontSize:11,color:m.due&&m.due<today()&&(m.status||"todo")!=="done"?"var(--bad)":"var(--muted)"}} />
        <div style={{flex:1}} />
        {addable&&addable.length>0&&(
          <button className="btn btn-xs btn-ghost" style={{color:"var(--accent)"}} onClick={onAddLines}
            title="Attach the lines selected in the script to this tag">
            ＋ {addable.length} line{addable.length>1?"s":""}
          </button>
        )}
        {canAnnotate&&(
          <button className={"btn btn-xs "+(annotating?"btn-primary":"btn-ghost")} onClick={onAnnotate}
            title="Highlight and annotate the script for this tag" style={annotating?undefined:{color:"var(--muted)"}}>
            {annotating?"Done":"⤢ Annotate"}
          </button>
        )}
        <button className="btn btn-xs btn-ghost" style={{color:"var(--dim)"}} title="Delete this tag"
          onClick={()=>onDelete(m.id)}>✕</button>
      </div>

      {brief?(
        <CommentItem c={brief} brief onSave={(txt)=>onEditComment(m,brief.id,txt)} onDelete={()=>onDelComment(m,brief.id)} />
      ):composer==="brief"?(
        <CommentComposer brief onSave={(txt)=>{ onAddComment(m,txt,true); setComposer(null); }} onCancel={()=>setComposer(null)} />
      ):(
        <div className="no-brief">
          <span>No brief</span>
          <button className="btn btn-xs btn-ghost" style={{color:"var(--accent)"}} onClick={()=>setComposer("brief")}>＋ Add brief</button>
        </div>
      )}

      {rest.length>visible.length&&(
        <button className="btn btn-xs btn-ghost" style={{color:"var(--muted)",marginTop:6}} onClick={()=>setUnfold(true)}>
          Show {rest.length-visible.length} earlier comment{rest.length-visible.length>1?"s":""}
        </button>
      )}
      {visible.map((c)=>(
        <CommentItem key={c.id} c={c} onSave={(txt)=>onEditComment(m,c.id,txt)} onDelete={()=>onDelComment(m,c.id)} />
      ))}

      {composer==="comment"?(
        <CommentComposer onSave={(txt)=>{ onAddComment(m,txt,false); setComposer(null); }} onCancel={()=>setComposer(null)} />
      ):(
        <button className="btn btn-xs btn-ghost add-comment" onClick={()=>setComposer("comment")}>＋ Add comment</button>
      )}
    </div>
  );
}

/* =============== board =============== */
function Board({ markers,tagOf,range,fps,onUpdate,onSeek,cues,cueIndex,isPhone }){
  const [col,setCol]=useState("todo");   // phone: one status column at a time
  return (
    <div style={{flex:1,display:"flex",flexDirection:"column",minHeight:0}}>
      {isPhone&&(
        <div className="pane-switch">
          {STATUS.map((s)=>(
            <button key={s.id} className={col===s.id?"on":""} onClick={()=>setCol(s.id)}>

/* =============== calendar =============== */
function Calendar({ projects,current,onOpenProject,onPatch,isPhone }){
  const [pickDay,setPickDay]=useState(null);   // phone: cells show dots, the tapped day lists its tasks
  const [cursor,setCursor]=useState(()=>{ const d=new Date(); return new Date(d.getFullYear(),d.getMonth(),1); });
  const all=Object.values(projects);
  const list=all.length?all:[current];

  const y=cursor.getFullYear(), mo=cursor.getMonth();
  const first=new Date(y,mo,1), startDow=(first.getDay()+6)%7;   // Monday first
  const days=new Date(y,mo+1,0).getDate();
  const cells=[];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1;d<=days;d++) cells.push(new Date(y,mo,d));
  while(cells.length%7) cells.push(null);

  const iso=localISO;
  const tasksOn=(d)=>{
    const key=iso(d); if(!key) return [];
    const out=[];
    list.forEach((p)=>(p.markers||[]).forEach((m)=>{
      if(m.due===key) out.push({ p, m, tag:(p.tags||[]).find((t)=>t.id===m.tagId) });
    }));
    return out;
  };
  const rangesOn=(d)=>{
    const key=iso(d); if(!key) return [];
    return list.filter((p)=>p.startDate&&p.dueDate&&key>=p.startDate&&key<=p.dueDate);
  };

  return (
    // the month grid stays left-to-right (English weekday names, time runs forward like the waveform)
    <div dir="ltr" style={{flex:1,display:"flex",flexDirection:"column",minHeight:0}}>
      <div className="pane-head">
        <button className="btn btn-sm btn-ghost" onClick={()=>setCursor(new Date(y,mo-1,1))}>←</button>
        <h2 style={{minWidth:150}}>{cursor.toLocaleString("en",{month:"long",year:"numeric"})}</h2>
        <button className="btn btn-sm btn-ghost" onClick={()=>setCursor(new Date(y,mo+1,1))}>→</button>
        <button className="btn btn-sm btn-ghost" onClick={()=>{const d=new Date();setCursor(new Date(d.getFullYear(),d.getMonth(),1));}}>Today</button>
        <div style={{flex:1}} />
        <span style={{fontSize:12,color:"var(--muted)"}}>This project:</span>
        <DatePicker className="btn btn-sm" value={current.startDate||""} placeholder="Start"
          onChange={(v)=>onPatch({startDate:v})} />
        <span style={{color:"var(--dim)"}}>→</span>
        <DatePicker className="btn btn-sm" value={current.dueDate||""} placeholder="Due"
          onChange={(v)=>onPatch({dueDate:v})} />
      </div>
      <div className="pane" style={{flex:1}}>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:5,marginBottom:6}}>
          {["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map((d)=>(
            <div key={d} style={{fontSize:11,color:"var(--dim)",textAlign:"center",padding:"2px 0"}}>{d}</div>
          ))}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:5}}>
          {cells.map((d,i)=>{
            const tasks=tasksOn(d), ranges=rangesOn(d);
            const isToday=d&&iso(d)===today();
            return (
              <div key={i} className={"cal-day"+(!d?" dim":"")+(isToday?" today":"")+(isPhone&&d&&pickDay===iso(d)?" picked":"")}
                onClick={isPhone&&d?()=>setPickDay(iso(d)):undefined}>
                {d&&<div className="mono" style={{fontSize:11,color:isToday?"var(--accent)":"var(--dim)"}}>{d.getDate()}</div>}
                {ranges.map((p)=>(
                  <div key={p.id} onClick={()=>onOpenProject(p)} title={p.name}
                    style={{height:3,borderRadius:2,background:"var(--accent)",opacity:.55,cursor:"pointer"}} />
                ))}
                {isPhone&&tasks.length>0&&(
                  <div className="cal-dots">{tasks.slice(0,6).map(({m,tag})=>(
                    <span key={m.id} className="dot" style={{background:tag?tag.color:"#999",borderRadius:"50%"}} />))}</div>
                )}
                {!isPhone&&tasks.slice(0,4).map(({p,m,tag})=>(
                  <div key={m.id} onClick={()=>onOpenProject(p)} title={(briefText(m)||tag&&tag.label||"task")+" — "+p.name}
                    style={{fontSize:10,padding:"1px 5px",borderRadius:4,cursor:"pointer",
                            background:(tag?tag.color:"#999")+"26",color:tag?tag.color:"var(--muted)",
                            overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis",
                            opacity:(m.status||"todo")==="done"?.5:1,
                            textDecoration:(m.status||"todo")==="done"?"line-through":"none"}}>
                    {briefText(m)?briefText(m).slice(0,22):(tag?tag.label:"task")}
                  </div>
                ))}
                {!isPhone&&tasks.length>4&&<div style={{fontSize:10,color:"var(--dim)"}}>+{tasks.length-4} more</div>}
              </div>
            );
          })}
        </div>
        {isPhone&&pickDay&&(()=>{ const list=tasksOn(parseISODate(pickDay));
          return (
            <div className="cal-list">
              <div style={{fontSize:12,fontWeight:600,marginBottom:4}} className="mono">{pickDay}</div>
              {list.length===0?<div style={{fontSize:12,color:"var(--dim)"}}>Nothing due.</div>:list.map(({p,m,tag})=>(
                <button key={m.id} className="cal-task" onClick={()=>onOpenProject(p)}>
                  <span className="dot" style={{background:tag?tag.color:"#999"}} />
                  <span dir="auto" style={{flex:1,textAlign:"start"}}>{briefText(m)||(tag?tag.label:"task")}</span>
                  <span style={{fontSize:11,color:"var(--dim)"}}>{p.name}</span>
                </button>
              ))}
            </div>
          ); })()}
        <p style={{color:"var(--dim)",fontSize:12,marginTop:14}}>
          Every project you've saved in this browser shows here. Set a due date on any shot and it lands on this grid.
        </p>
      </div>
    </div>
  );
}

/* =============== cue editor =============== */
function CueEditor({ cue,onSave,onCancel,size }){
  const [text,setText]=useState(cue.text);
  const [start,setStart]=useState(cue.start!==null?clock(cue.start):"");
  return (
    <span style={{flex:1}} onClick={(e)=>e.stopPropagation()}>
      <textarea autoFocus className="field" value={text} dir={hasArabic(text)?"rtl":"ltr"}
        onChange={(e)=>setText(e.target.value)}
        onKeyDown={(e)=>{ if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();onSave(cue.id,text,parseTime(start));}
                          if(e.key==="Escape") onCancel(); }}
        style={{fontSize:size,minHeight:60,textAlign:"start"}} />
      <span style={{display:"flex",gap:7,marginTop:6,alignItems:"center"}}>
        <input className="field mono" value={start} onChange={(e)=>setStart(e.target.value)}
          placeholder="0:00" style={{width:76,padding:"3px 7px",fontSize:12}} />
        <button className="btn btn-xs btn-primary" onClick={()=>onSave(cue.id,text,parseTime(start))}>Save</button>
        <button className="btn btn-xs btn-ghost" onClick={onCancel} style={{color:"var(--muted)"}}>Cancel</button>
        <span style={{color:"var(--dim)",fontSize:11}}>enter saves · esc cancels</span>
      </span>
    </span>
  );
}

/* =============== re-anchor preview (item 9) =============== */
function ReanchorModal({ plan, lineCount, tagOf, onApply, onWipe, onClose }){
  const c=plan.counts;
  const amb=plan.rows.filter((r)=>r.kind==="ambiguous"), un=plan.rows.filter((r)=>r.kind==="unmatched");
  const stat=(n,label,color,hint)=>(
    <div className="rstat"><div className="mono" style={{fontSize:22,color,lineHeight:1.2}}>{n}</div>
      <div style={{fontSize:12,fontWeight:600}}>{label}</div><div style={{fontSize:11,color:"var(--dim)",lineHeight:1.5}}>{hint}</div></div>);
  const list=(title,rows,withNew)=>rows.length>0&&(
    <div style={{marginTop:12}}>
      <div style={{fontSize:12,color:"var(--muted)",marginBottom:5}}>{title}</div>
      <div style={{border:"1px solid var(--line)",borderRadius:7,maxHeight:170,overflowY:"auto"}}>
        {rows.map((r,i)=>{ const t=tagOf(r.m.tagId);
          return <div key={r.m.id} style={{display:"flex",gap:8,alignItems:"center",padding:"6px 10px",fontSize:12,
            borderTop:i?"1px solid var(--line)":"none"}}>
            <span className="chip" style={{background:t.color+"22",color:t.color}}><span className="dot" style={{background:t.color}} />{t.label}</span>
            <span className="mono" style={{color:"var(--dim)"}}>{clock(r.r.start)}–{clock(r.r.end)}</span>
            {withNew&&r.nr&&<span className="mono" style={{color:"var(--warn)"}}>→ {clock(r.nr.start)}–{clock(r.nr.end)}</span>}
          </div>; })}
      </div>
    </div>);
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal enter" onClick={(e)=>e.stopPropagation()}>
        <div className="pane-head"><h2>Keep your tags on the new script</h2><div style={{flex:1}} />
          <button className="btn btn-xs btn-ghost" onClick={onClose}>✕</button></div>
        <div style={{padding:16,overflowY:"auto"}}>
          <p style={{marginTop:0,fontSize:13,color:"var(--muted)",lineHeight:1.7}}>
            The new version has {lineCount} lines. Every tag keeps its time range and is linked to the new lines under it.
            Nothing changes until you apply, and ⌘Z undoes it.
          </p>
          <div className="rstats">
            {stat(c.clean,"Re-anchored","var(--ok)","new lines sit inside the old range")}
            {stat(c.ambiguous,"Check these","var(--warn)","a new line sticks out > 0.5 s")}
            {stat(c.unmatched,"No line left","var(--bad)","kept as a region at its old times")}
            {stat(c.kept,"Time-only","var(--muted)","regions without lines, unchanged")}
          </div>
          {(plan.hlMoved+plan.hlLost)>0&&(
            <p style={{fontSize:12,color:"var(--muted)",marginBottom:0}}>
              Highlights: {plan.hlMoved} moved to the new lines
              {plan.hlLost?" · "+plan.hlLost+" not found in the new wording (kept aside, hidden)":""}.
            </p>
          )}
          {list("Ambiguous — old range → new lines",amb,true)}
          {list("No line under them any more",un,false)}
        </div>
        <div style={{padding:"12px 16px",borderTop:"1px solid var(--line)",display:"flex",gap:8,flexWrap:"wrap"}}>
          <button className="btn btn-primary" onClick={onApply}>Apply · keep {plan.markers.length} tag{plan.markers.length===1?"":"s"}</button>
          <button className="btn" style={{color:"var(--bad)"}}
            onClick={()=>{ if(window.confirm("Replace the script and delete all "+plan.markers.length+" tags?")) onWipe(); }}>
            Replace &amp; delete tags
          </button>
          <div style={{flex:1}} />
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
        </div>
      </div>
    </div>
  );
}

function ImportModal({ text,setText,onApply,onClose,tagCount }){
  const [fill,setFill]=useState(true);
  const preview=useMemo(()=>parseScript(text,fill),[text,fill]);
  const timed=preview.filter((c)=>c.start!==null).length;
  const heads=preview.filter((c)=>c.kind==="head").length;
  const stretched=preview.filter((c)=>c.origEnd!==null&&c.end!==null&&c.end>c.origEnd+0.05).length;
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal enter" onClick={(e)=>e.stopPropagation()}>
        <div className="pane-head"><h2>Import script</h2><div style={{flex:1}} />
          <button className="btn btn-xs btn-ghost" onClick={onClose}>✕</button></div>
        <div style={{padding:16,overflowY:"auto"}}>
          <textarea className="field" value={text} onChange={(e)=>setText(e.target.value)}
            dir={hasArabic(text)?"rtl":"ltr"} autoFocus
            placeholder={"# الخلفية\n\n00:00:00\n00:00:04\nفي بداية القرن التاسع عشر…"}
            style={{minHeight:230,fontSize:14,lineHeight:1.85}} />
          <label style={{display:"flex",alignItems:"center",gap:8,marginTop:10,fontSize:13,color:"var(--muted)"}}>
            <input type="checkbox" checked={fill} onChange={(e)=>setFill(e.target.checked)} />

          </label>
          {preview.length>0&&(
            <p className="mono" style={{fontSize:12,color:timed?"var(--ok)":"var(--warn)"}}>
              {preview.length} lines · {timed} timed · {heads} headings
              {stretched?" · "+stretched+" stretched over pauses":""}
            </p>
          )}
        </div>
        <div style={{padding:"12px 16px",borderTop:"1px solid var(--line)",display:"flex",gap:8}}>
          <button className="btn btn-primary" onClick={()=>onApply(text,true,fill)} disabled={!preview.length}

          <div style={{flex:1}} />
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
        </div>
      </div>
    </div>
  );
}

        </div>
      </div>
    </div>
  );

                    {p.dueDate?" · due "+p.dueDate:""}
                  </div>
                </div>
                {p.id!==current.id&&<button className="btn btn-xs" onClick={()=>onOpen(p)}>Open</button>}
                <button className="btn btn-xs btn-ghost" style={{color:"var(--dim)"}}
                  onClick={()=>{ if(window.confirm("Delete “"+p.name+"”? This can't be undone.")) onDelete(p.id); }}>✕</button>
              </div>
            );
          })}
          <p style={{color:"var(--muted)",fontSize:12,lineHeight:1.7,marginTop:14}}>
            Projects save in this browser automatically. Sign in to sync them across devices, or use
            Export → Project backup for a file you can keep or move.
          </p>
        </div>
        <div style={{padding:"12px 16px",borderTop:"1px solid var(--line)",display:"flex",gap:8,flexWrap:"wrap"}}>
          <button className="btn btn-primary" onClick={onNew}>New project</button>
          <button className="btn" onClick={onDuplicate}>Duplicate</button>
          <div style={{flex:1}} />
          <button className="btn" onClick={onExport}>Export .json</button>
          <button className="btn" onClick={onImportClick}>Import .json</button>
        </div>
      </div>
    </div>
  );
}

/* =============== help =============== */
function HelpModal({ onClose }){
  const Row=({k,v})=>(
    <div style={{display:"flex",gap:12,padding:"4px 0",fontSize:13}}>
      <span className="mono" style={{color:"var(--accent)",minWidth:150}}>{k}</span>
      <span style={{color:"var(--muted)",flex:1}}>{v}</span>
    </div>
  );
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal enter" onClick={(e)=>e.stopPropagation()}>
        <div className="pane-head"><h2>Formats & shortcuts</h2><div style={{flex:1}} />
          <button className="btn btn-xs btn-ghost" onClick={onClose}>✕</button></div>
        <div style={{padding:16,overflowY:"auto"}}>
          <h3 style={{fontSize:13,marginTop:0}}>Script file symbols</h3>
          <Row k="# Text" v="Heading" />
          <Row k="## Text" v="Sub-heading" />
          <Row k='"Text"' v="Heading (same as #)" />
          <Row k="> Text" v="Note — shown in italics, not a script line" />
          <Row k="// Text" v="Ignored completely" />
          <Row k="[0:00 - 0:04] text" v="Line with an inline time range" />
          <Row k="00:00:00 ⏎ 00:00:04 ⏎ text" v="Start, end, text on three lines" />
          <Row k="00:00 --> 00:04" v="SRT / VTT arrow form" />

          <h3 style={{fontSize:13,marginTop:18}}>Tag list file</h3>
          <div className="mono" style={{fontSize:12,background:"var(--bg)",border:"1px solid var(--line)",
            borderRadius:7,padding:10,lineHeight:1.8,marginTop:6,overflowX:"auto"}}>
            # tag | start | end | status | due | note<br/>
            Map animation | 1:00 | 3:24 | todo | 2026-09-20 | Qing borders, Arabic labels<br/>
            AI scene | 4:10 | 4:22 | doing | | harbour at dawn, wide
          </div>
          <p style={{fontSize:12,color:"var(--muted)",lineHeight:1.7}}>
            Status is todo, doing or done. Due is YYYY-MM-DD. Any field after the fifth pipe is treated as note text.
            Unknown tag names are created automatically with a new colour.
          </p>

          <h3 style={{fontSize:13,marginTop:18}}>Keyboard</h3>
          <Row k="space" v="Play / pause" />
          <Row k="← →" v="Scrub 2s · shift for 10s" />
          <Row k="↑ ↓" v="Previous / next line" />
          <Row k="1 – 9" v="Apply that tag" />
          <Row k="delete" v="Delete selected lines" />
          <Row k="⌘Z / ⌘⇧Z" v="Undo / redo" />
          <Row k="⌘A" v="Select every line" />
          <Row k="+ −" v="Zoom the waveform" />
          <Row k="⌘ + scroll" v="Zoom the waveform at the cursor" />
          <Row k="F" v="Follow audio on / off" />
          <Row k=", ." v="Previous / next shot" />
          <Row k="esc" v="Clear selection and region · leave annotation mode" />
          <Row k="?" v="This help" />

          <h3 style={{fontSize:13,marginTop:18}}>Working with tags</h3>
          <Row k="▶ on a shot" v="Play just that shot, stopping at its end" />
          <Row k="⤢ Annotate" v="Highlight words for one tag; click a highlight to add its note, Delete removes it" />
          <Row k="✕ on a line" v="In annotation mode, detach that line from the tag" />
          <Row k="＋ N lines" v="Attach the lines selected in the script to a tag" />
          <Row k="Brief" v="The first comment — the main instruction animators see" />
          <Row k="Replace script…" v="Load a new version; tags move onto the new lines after a preview" />
          <Row k="Compact / Expanded" v="Shot list density, remembered per project" />
        </div>
        <div style={{padding:"12px 16px",borderTop:"1px solid var(--line)"}}>
          <button className="btn btn-primary" onClick={onClose}>Got it</button>
        </div>
      </div>
    </div>
  );
}

/* =============== cloud / login =============== */
function CloudModal({ cfg,sb,user,autoUpload,autoFetch,onAuto,onAutoFetch,onSaveCfg,onSignedIn,onSignOut,onSync,onClose }){
  const [url,setUrl]=useState((cfg&&cfg.url)||"");
  const [key,setKey]=useState((cfg&&cfg.key)||"");
  const [email,setEmail]=useState("");
  const [pw,setPw]=useState("");
  const [mode,setMode]=useState("in");
  const [busy,setBusy]=useState(false);
  const [msg,setMsg]=useState("");
  const configured=!!(cfg&&cfg.url&&cfg.key);

  const go=async()=>{
    if(!sb){ setMsg("Save your project URL and key first."); return; }
    if(!email||!pw){ setMsg("Email and password are both required."); return; }
    setBusy(true); setMsg("");
    const r=mode==="in"
      ? await sb.auth.signInWithPassword({ email:email.trim(), password:pw })
      : await sb.auth.signUp({ email:email.trim(), password:pw });
    setBusy(false);
    if(r.error){ setMsg(r.error.message); return; }
    if(mode==="up"&&r.data&&!r.data.session){
      setMsg("Account created. Open the confirmation email, then come back and sign in.");
      setMode("in"); return;
    }
    onSignedIn();
  };

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal enter" onClick={(e)=>e.stopPropagation()} style={{maxWidth:470}}>
        <div className="pane-head">
          <img src={LOGO} alt="" style={{height:18,opacity:.9}} />
          <h2>{user?"Cloud":"Sign in"}</h2>
          <div style={{flex:1}} />
          <button className="btn btn-xs btn-ghost" onClick={onClose}>✕</button>
        </div>

        <div style={{padding:16,overflowY:"auto"}}>
          {user?(
            <div>
              <p style={{marginTop:0,fontSize:14}}>
                Signed in as <b>{user.email}</b>
              </p>
              <label style={{display:"flex",alignItems:"center",gap:8,fontSize:13,color:"var(--muted)",margin:"14px 0 8px"}}>
                <input type="checkbox" checked={autoUpload} onChange={(e)=>onAuto(e.target.checked)} />
                Upload audio automatically when I load a file
              </label>
              <label style={{display:"flex",alignItems:"center",gap:8,fontSize:13,color:"var(--muted)",margin:"0 0 14px"}}>
                <input type="checkbox" checked={autoFetch} onChange={(e)=>onAutoFetch(e.target.checked)} />
                Download the audio automatically when a project opens
              </label>
              <p style={{fontSize:12,color:"var(--dim)",lineHeight:1.75}}>
                Every project in this browser is uploaded when you sign in and after each change, and
                anything newer in the cloud comes down. Audio for a project you haven't touched in 14
                days is deleted on the next sync — the project itself is never deleted.
              </p>
              <div style={{display:"flex",gap:8,marginTop:16,flexWrap:"wrap"}}>
                <button className="btn btn-primary" onClick={onSync}>Sync now</button>
                <div style={{flex:1}} />
                <button className="btn btn-ghost" onClick={onSignOut} style={{color:"var(--bad)"}}>Sign out</button>
              </div>
            </div>
          ):(
            <div>
              {!configured&&(
                <div style={{marginBottom:18,paddingBottom:16,borderBottom:"1px solid var(--line)"}}>
                  <p style={{marginTop:0,fontSize:13,color:"var(--muted)",lineHeight:1.7}}>
                    One-time setup. Paste these from your Supabase dashboard —
                    Project Settings → API. See SETUP-GUIDE.txt.
                  </p>
                  <input className="field" value={url} onChange={(e)=>setUrl(e.target.value)}
                    placeholder="Project URL — https://xxxx.supabase.co"
                    style={{marginBottom:8,fontSize:13}} />
                  <input className="field" value={key} onChange={(e)=>setKey(e.target.value)}
                    placeholder="Publishable / anon key" style={{fontSize:13}} />
                  <button className="btn btn-primary" style={{marginTop:10}}
                    disabled={!url.trim()||!key.trim()}
                    onClick={()=>onSaveCfg({url:url.trim(),key:key.trim()})}>Save connection</button>
                </div>
              )}

              <div style={{display:"flex",gap:4,marginBottom:12}}>
                <button className={"tab"+(mode==="in"?" on":"")} onClick={()=>setMode("in")}>Sign in</button>
                <button className={"tab"+(mode==="up"?" on":"")} onClick={()=>setMode("up")}>Create account</button>
              </div>
              <input className="field" type="email" autoComplete="username" value={email}
                onChange={(e)=>setEmail(e.target.value)} placeholder="Email"
                style={{marginBottom:8}} onKeyDown={(e)=>{ if(e.key==="Enter") go(); }} />
              <input className="field" type="password" autoComplete="current-password" value={pw}
                onChange={(e)=>setPw(e.target.value)} placeholder="Password (at least 6 characters)"
                onKeyDown={(e)=>{ if(e.key==="Enter") go(); }} />
              {msg&&<p style={{fontSize:12,color:"var(--warn)",lineHeight:1.6}}>{msg}</p>}
              <button className="btn btn-primary" style={{marginTop:12,width:"100%"}}
                disabled={busy||!configured} onClick={go}>
                {busy?"Working…":mode==="in"?"Sign in":"Create account"}
              </button>
              {configured&&(
                <button className="btn btn-ghost btn-sm" style={{marginTop:10,color:"var(--dim)"}}
                  onClick={()=>onSaveCfg({url:"",key:""})}>Change Supabase connection</button>
              )}
              <p style={{fontSize:12,color:"var(--dim)",lineHeight:1.75,marginTop:14}}>
                You don't have to sign in. Everything works offline and saves in this browser —
                signing in adds sync across devices and audio storage.
              </p>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
